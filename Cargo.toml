[workspace]
members = [
    "crates/lemnos",
    "crates/lemnos-core",
    "crates/lemnos-hal",
    "crates/lemnos-device",
    "crates/lemnos-lite",
    "crates/lemnos-bus",
    "crates/lemnos-discovery",
    "crates/lemnos-driver-sdk",
    "crates/lemnos-driver-manifest",
    "crates/lemnos-registry",
    "crates/lemnos-runtime",
    "crates/lemnos-linux",
    "crates/lemnos-linux-sys",
    "crates/lemnos-macros",
    "crates/lemnos-macros-tests",
    "crates/lemnos-drivers-gpio",
    "crates/lemnos-drivers-pwm",
    "crates/lemnos-drivers-i2c",
    "crates/lemnos-drivers-spi",
    "crates/lemnos-drivers-uart",
    "crates/lemnos-drivers-usb",
    "crates/lemnos-drivers-vcm",
    "crates/lemnos-drivers-ina2xx",
    "crates/lemnos-drivers-bmm150",
    "crates/lemnos-drivers-bmi088",
    "crates/lemnos-mock",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/Prometheus-Dynamics/Lemnos"
homepage = "https://github.com/Prometheus-Dynamics/Lemnos"

[workspace.dependencies]
lemnos = { version = "2.0.0", path = "crates/lemnos" }
lemnos-bus = { version = "2.0.0", path = "crates/lemnos-bus" }
lemnos-core = { version = "2.0.0", path = "crates/lemnos-core", default-features = false }
lemnos-hal = { version = "2.0.0", path = "crates/lemnos-hal", default-features = false }
lemnos-device = { version = "2.0.0", path = "crates/lemnos-device", default-features = false }
lemnos-lite = { version = "2.0.0", path = "crates/lemnos-lite" }
lemnos-discovery = { version = "2.0.0", path = "crates/lemnos-discovery", default-features = false }
lemnos-driver-manifest = { version = "2.0.0", path = "crates/lemnos-driver-manifest", default-features = false }
lemnos-driver-sdk = { version = "2.0.0", path = "crates/lemnos-driver-sdk" }
lemnos-drivers-gpio = { version = "2.0.0", path = "crates/lemnos-drivers-gpio" }
lemnos-drivers-i2c = { version = "2.0.0", path = "crates/lemnos-drivers-i2c" }
lemnos-drivers-pwm = { version = "2.0.0", path = "crates/lemnos-drivers-pwm" }
lemnos-drivers-spi = { version = "2.0.0", path = "crates/lemnos-drivers-spi" }
lemnos-drivers-uart = { version = "2.0.0", path = "crates/lemnos-drivers-uart" }
lemnos-drivers-usb = { version = "2.0.0", path = "crates/lemnos-drivers-usb" }
lemnos-drivers-vcm = { version = "2.0.0", path = "crates/lemnos-drivers-vcm" }
lemnos-drivers-ina2xx = { version = "2.0.0", path = "crates/lemnos-drivers-ina2xx" }
lemnos-drivers-bmm150 = { version = "2.0.0", path = "crates/lemnos-drivers-bmm150" }
lemnos-drivers-bmi088 = { version = "2.0.0", path = "crates/lemnos-drivers-bmi088" }
lemnos-linux = { version = "2.0.0", path = "crates/lemnos-linux", default-features = false }
lemnos-linux-sys = { version = "2.0.0", path = "crates/lemnos-linux-sys" }
lemnos-macros = { version = "2.0.0", path = "crates/lemnos-macros" }
lemnos-mock = { version = "2.0.0", path = "crates/lemnos-mock" }
lemnos-registry = { version = "2.0.0", path = "crates/lemnos-registry" }
lemnos-runtime = { version = "2.0.0", path = "crates/lemnos-runtime" }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
libc = "0.2.190"
ordered-float = { version = "5.5.0", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
rusb = "0.9.4"
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serialport = { version = "4.10.1", default-features = false }
syn = { version = "3.0.6", features = ["full"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
trybuild = "1.0.121"
tokio = { version = "1.53.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
