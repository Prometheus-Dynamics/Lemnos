[workspace]
# Every directory directly inside these folders must be a crate. Adding a crate
# never edits this file.
members = [
  "engine/*",
  "backends/*",
  "service/*",
  "contracts/*",
  "drivers/*",
  "testing/crates/*",
  # The shared-memory ring family: standalone, no dependency on anything else here.
  "shm/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.1-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/Prometheus-Dynamics/Lemnos"
homepage = "https://github.com/Prometheus-Dynamics/Lemnos"

[workspace.dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
libc = "0.2.190"
tokio = { version = "1.53.2", default-features = false }
serde = { version = "1.0.229", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
thiserror = { version = "2.0.21", default-features = false }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }

# Crates that may use `unsafe` (see AGENTS.md) carry their own lint table.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Line tables keep file:line in panics; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# lemnosd and lemnos-ctl as shipped in OS images. Unwinding is required: it is
# what lets the host contain a panicking driver.
[profile.service]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "unwind"
strip = true
