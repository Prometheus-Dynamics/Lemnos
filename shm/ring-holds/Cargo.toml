[package]
name = "shm-ring-holds"
description = "Hold marks for shm-ring-buffers: what keeps a frame's buffers from reuse while a reader looks, and the limits on it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
shm-ring = { path = "../ring" }
shm-ring-buffers = { path = "../ring-buffers" }

[dev-dependencies]
libc.workspace = true
loom = "0.7.3"
shm-fdpass = { path = "../fdpass" }
shm-measure = { path = "../measure" }

# The library forbids `unsafe`. One test passes descriptors to a child process, so the crate
# keeps its own lint table.
# Needs `unsafe` for system calls and shared mappings, so it keeps its own lint table: `unsafe`
# stays in the modules that allow it, and every block carries a `SAFETY` comment and holds one
# operation.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
