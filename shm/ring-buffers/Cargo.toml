[package]
name = "shm-ring-buffers"
description = "Buffer topics over shm-ring: a pool of shared buffers handed over once, and ring entries that name them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
libc.workspace = true
shm-ring = { path = "../ring" }

[dev-dependencies]
shm-fdpass = { path = "../fdpass" }
shm-measure = { path = "../measure" }

# Needs `unsafe` for system calls and shared mappings, so it keeps its own lint table: `unsafe`
# stays in the modules that allow it, and every block carries a `SAFETY` comment and holds one
# operation.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
