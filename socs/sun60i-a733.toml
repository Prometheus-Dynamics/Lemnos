# The SoC map for the Allwinner A733 (sun60i). Data only: `lemnos-ctl tree` and `lemnos-ctl validate`
# read it.
#
# No VBUS handling: this map has no device port (`usb-peripheral`), so the generator writes no PHY
# supply. The A733 family runs mainline 7.3.4 plus this vendor series, and its USB-C PHY has no VBUS
# supply in that tree. A port added here later needs its base's VBUS fact (docs/device-tree.md).
#
# Source: the A733 kernel patch set of a vendor BSP (the `allwinner-bsp` repository, and the kernel
# patch series of its mainline packaging, `patches/`), applied to the kernel the packaging names
# (7.3-rc5 at its adaptation; the series is applied in the order its `patches/series` file gives). The SoC base is `arm64-dts-allwinner-add-allwinner-a733-soc.patch` (sun60i-a733.dtsi); the
# controllers are in the series' `a733-*` patches: `a733-eeprom-*` (i2c0), `a733-header` (i2c2, i2c7,
# spi1, uart2, uart4), `a733-pwm` (pwm0, pwm1), `a733-csi-isp-base` (csic, isp), and the pin groups
# in the base patch and `a733-dts-fixes` (uart0_pb_pins, uart2_pb_pins). Node paths are under the
# base's `soc` bus (`/soc`). The mainline sun60i-a733.dtsi (7.3-rc5 onwards) is not checked against it.
#
# Not in the map, because the series gives no pin group for them: the I2C and PWM pins, the SPI pins.
# A board that uses them wires them through the pinctrl it names, which this map does not give.
soc = "sun60i-a733"
# The base the board's loader hands the kernel is a full device tree (extlinux `fdt`), not an overlay.
form = "fragment"


[controllers.i2c0]
kind = "i2c"
path = "/soc/i2c@2510000"
alias = "i2c0"
reason = "an I2C (TWI) controller on the A733 (allwinner,sun60i-a733-i2c)"

[controllers.i2c2]
kind = "i2c"
path = "/soc/i2c@2512000"
alias = "i2c2"
reason = "an I2C (TWI) controller on the A733 (allwinner,sun60i-a733-i2c)"

[controllers.i2c7]
kind = "i2c"
path = "/soc/i2c@2517000"
alias = "i2c7"
reason = "an I2C (TWI) controller on the A733 (allwinner,sun60i-a733-i2c)"

[controllers.spi1]
kind = "spi"
path = "/soc/spi@2541000"
alias = "spi1"
reason = "an SPI controller on the A733 (allwinner,sun60i-a733-spi-dbi)"

[controllers.uart0]
kind = "uart"
path = "/soc/serial@2500000"
alias = "serial0"
reason = "a serial port on the A733 (snps,dw-apb-uart)"
[controllers.uart0.pins.pb9_pb10]
path = "/soc/pinctrl@2000000/uart0-pb-pins"
label = "uart0_pb_pins"
gpios = [41, 42]

[controllers.uart2]
kind = "uart"
path = "/soc/serial@2502000"
alias = "serial2"
reason = "a serial port on the A733 (snps,dw-apb-uart)"
[controllers.uart2.pins.pb0_pb1]
path = "/soc/pinctrl@2000000/uart2-pb-pins"
label = "uart2_pb_pins"
gpios = [32, 33]

[controllers.pwm0]
kind = "block"
path = "/soc/pwm@2527000"
reason = "a PWM controller on the A733 (allwinner,sun60i-a733-pwm); its pins are the board's pinctrl's"

[controllers.pwm1]
kind = "block"
path = "/soc/pwm@2528000"
reason = "a PWM controller on the A733 (allwinner,sun60i-a733-pwm); its pins are the board's pinctrl's"

[controllers.csic]
kind = "block"
path = "/soc/csic@5800000"
reason = "the camera sensor interface on the A733 (allwinner,sun60i-a733-csic); a driver of its own takes it"

[controllers.isp]
kind = "block"
path = "/soc/isp@5900000"
reason = "the image signal processor on the A733 (allwinner,sun60i-a733-isp)"

# The USB OTG controller (MUSB) as a device port, port 0. Node from the DockSeed series, the file
# `patches/a733-usb0-gadget/arm64-dts-allwinner-a733-add-the-usb0-otg-controller.patch` (fe0a8ed, sun60i-a733.dtsi):
# `usb_otg: usb@4100000`, compatible `allwinner,sun60i-a733-musb`, `allwinner,sun8i-a33-musb`, reg 0x04100000,
# status disabled in the SoC file (the board patch enables it, `dr_mode = "peripheral"`). The path is the series'
# bus node renamed `soc@0` (the rename is a later patch). UNCONFIRMED: from the series, not a built dtb.
# VBUS (PC-side repo 79e0c8ff, docs/prs/B19.md:120 and devices/boards/radxa-cubie-a7s/board.toml:31-35, the board that names this
# port): the PHY's VBUS supply is named per index (`usb0_vbus` for PHY 0, phy-sun4i-usb.c:819), and the series' A7S dts sets only
# `usb1_vbus`, so device mode on this port sources no 5 V. The compiled bring-up dtb shows `usb@4100000` with
# `dr_mode = "peripheral"` and no supply (PC-side repo's B19 record; not checked here). A board file that gives this port states
# `vbus_undriven` with that reason (BB1, docs/device-tree.md).
# The UDC name is not fixed: the kernel names the controller `musb-hdrc.N.auto` (N is not fixed), under the platform
# device `4100000.usb`, which is the name the port is given here (UNVERIFIED: to confirm on board). A gadget names it
# as `udc:4100000.usb`; the backend resolves it to the controller's own entry (lemnos-linux `resolve_udc`).
# No PHY `needs` entry: the series names `phys = <&usbphy 0>` and the PHY node's path is not in any source read.
[controllers.usb-otg0]
kind = "usb-peripheral"
path = "/soc@0/usb@4100000"
sysfs = "4100000.usb"
reason = "the USB OTG controller (MUSB) on the A733, port 0; device mode (allwinner,sun60i-a733-musb)"

# The always-on hardware watchdog, `r_wdt` (WDT_CPUS), `allwinner,sun60i-a733-wdt` with the `allwinner,sun55i-a523-wdt`
# fallback (the driver binds through the fallback, `sunxi_wdt`, DERIVED). Node from the DockSeed series, add-the-watchdogs.patch
# (`r_wdt: watchdog@7021000`, reg 0x07021000, no status line so enabled; the patch is applied to sun60i-a733.dtsi after
# `r_ccu`). The series' bus node is renamed `soc@0` by a later patch (name-the-bus-node-soc-0), so the path is written that way.
# UNCONFIRMED: the path is from the series patch, not from a built dtb. The mainline driver caps the timeout at 16 s
# (drivers/watchdog/sunxi_wdt.c:25); slot-init uses 15 s, which fits.
# PC-side repo's read of the same series (PC-side repo 79e0c8ff, docs/prs/B31.md:34, and devices/families/sun60i/assets/linux.fragment:69-74)
# gives the same node: `r_wdt@7021000`, from the series patch `a733-soc-kern/...add-the-watchdogs.patch`, enabled, WDT0 disabled.
# It is still one read of the series, not a built dtb. CONFIG_SUNXI_WATCHDOG is =y for the family: the family fragment
# (PC-side repo devices/families/sun60i/assets/linux.fragment:74, at 79e0c8ff) sets it, overriding the defconfig's =m (defconfig:816),
# with the reason at :69-73 (a module is loaded from the root, too late for PID 1's open).
# A request above 16 s is served only with the series' patch `sunxi-wdt-heartbeat`. It is carried by the family's whole series
# (family.toml:108, `patches = [{ source = "a733-kernel-series", path = "patches" }]`): the series file at its pinned rev fe0a8ed3
# lists it at patches/series:543 (`sunxi-wdt-heartbeat/watchdog-sunxi_wdt-let-the-watchdog-core-serve-timeouts-above-16-s.patch`, the file
# present at that rev). Without it the mainline driver returns -EINVAL. The OPEN_TIMEOUT=30 that the watchdog contract needs for sun60i is in
# the PC-side repo's pr/C1 (linux.fragment:83), not yet on its next.
# Not used: WDT0 (`watchdog@2050000`, series status disabled: "does not reliably reset the SoC").
[controllers.watchdog]
kind = "watchdog"
path = "/soc@0/watchdog@7021000"
reason = "the always-on hardware watchdog on the A733 (r_wdt, sun60i-a733-wdt, sun55i-a523-wdt fallback; series node, unconfirmed)"
