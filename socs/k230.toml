# The SoC map for the Kendryte K230 (and the K230D, which shares this SoC description). Data only:
# `lemnos-ctl tree` and `lemnos-ctl validate` read it.
#
# Source: the K230 SoC device tree of the Kendryte SDK, kendryte/k230_sdk at 7e302f733311d284be255f0d81d3463b6ae6ee6d,
# `src/little/linux/arch/riscv/boot/dts/kendryte/k230.dtsi` (the Linux tree the SDK builds: version
# 5.10.4). Node paths are under the `soc` bus of that file. The K230D board description
# (`k230d.dts` in the same directory, same SDK commit) includes it and adds `serial0` as the console.
# The SDK's kernel tree is a vendor tree; a mainline tree at v6.12 has no K230 device tree.
#
# Not in the map, because the SDK's SoC description has no node for them: the camera receiver (the DVP
# and CSI paths), the ISP, the graphics DMA engine, and the KPU. Their drivers need nodes that a board
# or a newer SoC description names. The GPIO ports are one node per pin in `gpio_provider.dtsi`
# (`canaan,k230-apb-gpio`, `ngpios = <1>`), and the kernel names their chips by their drivers; no
# `gpio:LABEL:LINE` chip is given here until a chip label is read from that driver.
#
# The SDK's post-build loads the device tree as a plain blob (`bootm $kernel_addr - $dtb_addr`, no
# `fdt apply`), so the output is a fragment for a board `.dts`.
#
# The MMC hosts are not map entries, as the SD and eMMC of the RK3566 and RK3588 are not. Each host has two names,
# one per device tree, and a `boot_sources` entry uses both (`<U-Boot path>=<kernel path>`, docs/slots.md):
#   - the SD slot: U-Boot `/soc/mmc1@91581000` (`mmc1`, `snps,dwcmshc-sdhci`, 4-bit), from the SDK's U-Boot
#     `src/little/uboot/arch/riscv/dts/k230.dtsi` lines 161-170 (`mmc1: mmc1@91581000`, under the root `soc` at line 60);
#     kernel `/soc/sdhci1@91581000` (`sdhci1`, `kendryte,k230-dw-mshc`, interrupt 144, 4-bit), from the SDK's kernel
#     `src/little/linux/arch/riscv/boot/dts/kendryte/k230.dtsi` lines 166-176.
#   - the eMMC: U-Boot `/soc/mmc0@91580000` (`mmc0`, `snps,dwcmshc-sdhci-k230`, 8-bit, `have-emmc-phy`), from the
#     U-Boot dtsi lines 149-159; kernel `/soc/sdhci0@91580000` (`sdhci0`, `kendryte,k230-dw-mshc`, interrupt 142, 8-bit),
#     from the kernel dtsi lines 154-164.
# The entry for the SD slot is `/soc/mmc1@91581000=/soc/sdhci1@91581000`; for the eMMC `/soc/mmc0@91580000=/soc/sdhci0@91580000`.
# The U-Boot paths are read from the source, not checked on a board: UNVERIFIED on board.
# `k230d.dts` (kernel) enables both hosts: `&mmc_sd0` (`is_emmc`, HS200) and `&mmc_sd1` (`cap-sd-highspeed`, no 1.8 V).
# Neither the K230D board file nor the SDK's boot configuration read for this map says which host the board boots
# from (`k230d.dts`'s `/chosen` sets only `bootargs = ""` and `stdout-path`); to confirm on board. No driver of the
# kernel MSHC compatible was found in the SDK's `drivers/mmc/host/dw_mmc.c` or `dw_mmc-pltfm.c` (they match
# `snps,dw-mshc` and other vendors' strings), so the stock binding of these hosts is not known here; to confirm on board.
soc = "k230"
form = "fragment"


[controllers.i2c0]
kind = "i2c"
path = "/soc/i2c@91405000"
alias = "i2c0"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c1]
kind = "i2c"
path = "/soc/i2c@91406000"
alias = "i2c1"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c2]
kind = "i2c"
path = "/soc/i2c@91407000"
alias = "i2c2"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c3]
kind = "i2c"
path = "/soc/i2c@91408000"
alias = "i2c3"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c4]
kind = "i2c"
path = "/soc/i2c@91409000"
alias = "i2c4"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.spi0]
kind = "spi"
path = "/soc/spi@91584000"
alias = "spi0"
reason = "an SPI controller on the K230 (snps,dwc-ssi-1.01a)"

[controllers.spi1]
kind = "spi"
path = "/soc/spi@91582000"
alias = "spi1"
reason = "an SPI controller on the K230 (snps,dwc-ssi-1.01a)"

[controllers.spi2]
kind = "spi"
path = "/soc/spi@91583000"
