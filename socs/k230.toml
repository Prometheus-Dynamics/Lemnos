[controllers.uart0]
kind = "block"
path = "/soc/serial@91400000"
alias = "serial0"
reason = "a serial port on the K230 (snps,dw-apb-uart); its pins are the board's pinctrl's, which this map does not give"

[controllers.pwm]
kind = "block"
path = "/soc/pwm@9140a000"
reason = "the PWM block on the K230 (canaan,k230-pwm); its pins are the board's pinctrl's, which this map does not give"

# The node is checked against the SDK revision the header names (kendryte/k230_sdk 7e302f73): its
# `src/little/linux/arch/riscv/boot/dts/kendryte/k230.dtsi` has `watchdog0: wdt0@91106000`, reg 0x91106000,
# `snps,dw-wdt`. A different K230 dtsi on disk (`wdt1@91106800`) is not this SDK's tree and is not used.
[controllers.watchdog0]
kind = "watchdog"
path = "/soc/wdt0@91106000"
reason = "the hardware watchdog on the K230 (snps,dw-wdt)"

# The USB 2 OTG controller 0 (`usbotg0`, `kendryte,k230-otg`, `dr_mode = "otg"`, interrupt 173), which the K230D
# board file (`k230d.dts`: `&usbotg0 { status = "okay"; }`) enables. The SDK's dwc2 driver binds the compatible
# (`drivers/usb/dwc2/params.c`, `dwc2_of_match_table`). The UDC name is the platform device's name: the SDK's
# `drivers/of/platform.c` names it `%llx.%pOFn` (address, then the node name without its unit address), so
# `usb-otg@91500000` is `91500000.usb-otg`, and the driver's `k230_otg_phy_init` compares that same name
# (`params.c`). `drivers/usb/gadget/udc/core.c` names the UDC by the parent's kobject name. Not checked on a board:
# to confirm on board. `usbotg1` (`/soc/usb-otg@91540000`, interrupt 174) is `disabled` in the K230D board file,
# so it is not in the map. The SDK tree has no PHY node for it, so it has no `needs` entry.
[controllers.usb-otg0]
kind = "usb-peripheral"
path = "/soc/usb-otg@91500000"
sysfs = "91500000.usb-otg"
reason = "the USB 2 OTG controller 0 on the K230 (kendryte,k230-otg, dwc2); device mode"
