# The SoC map for the Kendryte K230 (and the K230D, which shares this SoC description). Data only:
# `lemnos-ctl tree` and `lemnos-ctl validate` read it.
#
# Source: the K230 SoC device tree of the Kendryte SDK, kendryte/k230_sdk at 7e302f733311d284be255f0d81d3463b6ae6ee6d,
# `src/little/linux/arch/riscv/boot/dts/kendryte/k230.dtsi` (the Linux tree the SDK builds: version
# 5.10.4). Node paths are under the `soc` bus of that file. The K230D board description
# (`k230d.dts` in the same directory, same SDK commit) includes it and adds `serial0` as the console.
# The SDK's kernel tree is a vendor tree; a mainline tree at v6.12 has no K230 device tree.
#
# Not in the map, because the SDK's SoC description has no node for them: the camera receiver (the DVP
# and CSI paths), the ISP, the graphics DMA engine, and the KPU. Their drivers need nodes that a board
# or a newer SoC description names. The GPIO ports are one node per pin in `gpio_provider.dtsi`
# (`canaan,k230-apb-gpio`, `ngpios = <1>`), and the kernel names their chips by their drivers; no
# `gpio:LABEL:LINE` chip is given here until a chip label is read from that driver.
#
# The SDK's post-build loads the device tree as a plain blob (`bootm $kernel_addr - $dtb_addr`, no
# `fdt apply`), so the output is a fragment for a board `.dts`.
#
# The MMC hosts are not map entries, as the SD and eMMC of the RK3566 and RK3588 are not. Each host has two names,
# one per device tree, and a `boot_sources` entry uses both (`<U-Boot path>=<kernel path>`, docs/slots.md). The kernel
# names are the mainline ones, the names a running board's device tree shows:
#   - the SD slot: U-Boot `/soc/mmc1@91581000` (`mmc1: mmc1@91581000`, `snps,dwcmshc-sdhci`, 4-bit), from the Kendryte
#     SDK's U-Boot `buildroot-overlay/boot/uboot/u-boot-2022.10-overlay/arch/riscv/dts/k230.dtsi` lines 163-172; kernel
#     `/soc/mmc@91581000`.
#   - the SDIO0/eMMC host: U-Boot `/soc/mmc0@91580000` (`mmc0: mmc0@91580000`, `snps,dwcmshc-sdhci-k230`, 8-bit,
#     `have-emmc-phy`), lines 150-161 of the same file; kernel `/soc/mmc@91580000`. Which device sits on this host is a
#     board fact (a board may put an SDIO Wi-Fi module on its pins, not an eMMC); the board file says so.
# The kernel name must match mainline's mmc-controller binding, `^mmc(@.*)?$` (`Documentation/devicetree/bindings/mmc/
# mmc-controller.yaml` line 25, mainline v7.3.3 as checked out under `tmp/CZERO`). The SDK's kernel calls the eMMC host
# `sdhci0@91580000` (`buildroot-overlay/linux/0010-fix-emmc-tuning-failed-printf.patch`, the hunk at line 48,
# `mmc_sd0: sdhci0@91580000`). The SDK's kernel dtsi is not in the clone, so the SD host's vendor kernel name
# (`sdhci1`) is not checked here.
# The entries are `/soc/mmc1@91581000=/soc/mmc@91581000` (SD) and `/soc/mmc0@91580000=/soc/mmc@91580000` (eMMC/SDIO0).
# The U-Boot paths are read from the SDK source, not checked on a board: UNVERIFIED on board.
# This map matches node paths exactly. It does not key a controller on its unit address, so a vendor kernel's
# `sdhci0@...` names are not served by this map; a map for that kernel would be a separate file. To confirm on board.
soc = "k230"
form = "fragment"


[controllers.i2c0]
kind = "i2c"
path = "/soc/i2c@91405000"
alias = "i2c0"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c1]
kind = "i2c"
path = "/soc/i2c@91406000"
alias = "i2c1"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c2]
kind = "i2c"
path = "/soc/i2c@91407000"
alias = "i2c2"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c3]
kind = "i2c"
path = "/soc/i2c@91408000"
alias = "i2c3"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.i2c4]
kind = "i2c"
path = "/soc/i2c@91409000"
alias = "i2c4"
reason = "an I2C (DesignWare) bus on the K230 (snps,designware-i2c)"

[controllers.spi0]
kind = "spi"
path = "/soc/spi@91584000"
alias = "spi0"
reason = "an SPI controller on the K230 (snps,dwc-ssi-1.01a)"

[controllers.spi1]
kind = "spi"
path = "/soc/spi@91582000"
alias = "spi1"
reason = "an SPI controller on the K230 (snps,dwc-ssi-1.01a)"

[controllers.spi2]
kind = "spi"
path = "/soc/spi@91583000"
alias = "spi2"
reason = "an SPI controller on the K230 (snps,dwc-ssi-1.01a)"

[controllers.uart0]
kind = "block"
path = "/soc/serial@91400000"
alias = "serial0"
reason = "a serial port on the K230 (snps,dw-apb-uart); its pins are the board's pinctrl's, which this map does not give"

[controllers.pwm]
kind = "block"
path = "/soc/pwm@9140a000"
reason = "the PWM block on the K230 (canaan,k230-pwm); its pins are the board's pinctrl's, which this map does not give"

# The node is checked against the SDK revision the header names (kendryte/k230_sdk 7e302f73): its
# `src/little/linux/arch/riscv/boot/dts/kendryte/k230.dtsi` has `watchdog0: wdt0@91106000`, reg 0x91106000,
# `snps,dw-wdt`. A different K230 dtsi on disk (`wdt1@91106800`) is not this SDK's tree and is not used.
[controllers.watchdog0]
kind = "watchdog"
path = "/soc/wdt0@91106000"
reason = "the hardware watchdog on the K230 (snps,dw-wdt)"

# The USB 2 OTG controller 0 (`usbotg0: usb-otg@91500000`, `snps,dwc2`, `dr_mode = "otg"`), from the Kendryte SDK's
# U-Boot `buildroot-overlay/boot/uboot/u-boot-2022.10-overlay/arch/riscv/dts/k230.dtsi` line 260. The kernel node is
# `/soc/usb@91500000`: the name a running board's mainline device tree shows. The UDC name is the platform device's
# name, `91500000.usb` (the address, then the node name without its unit address; the board's mainline tree gives
# the same name). `usbotg1` (`usb-otg@91540000` in U-Boot, line 271) is not in the map. The UDC name and the node name are not checked on a board: to confirm on board.
[controllers.usb-otg0]
kind = "usb-peripheral"
path = "/soc/usb@91500000"
sysfs = "91500000.usb"
reason = "the USB 2 OTG controller 0 on the K230 (dwc2); device mode"
