# The B14 fan-control rehearsal's board for `lemnosd --sim`, the REAL phase: the controller reads the zone
# that stands in for the board's real thermal zone, a fake (testing/crates/fake-devices, fake-thermal-zone).
# testing/fan-control/b14.sh replaces @FAN@ and @REAL@. The stand-in's temperature is its `temp` file, which
# the script writes as the load's stand-in (a rising then falling temperature).
format = "lemnos.board"
schema_version = 1

[board]
id = "b14-sim-real"

[[devices]]
id = "fan"
driver = "fake-fan"
config = { duty = 702, file = "@FAN@" }

[[devices]]
id = "cpu-thermal"
driver = "fake-thermal-zone"
config = { path = "@REAL@" }

[[devices]]
id = "fan-control"
driver = "fan-control"
uses = { fan = "fan", t0 = "cpu-thermal" }
config = { curve_t0 = "30000:300,60000:600,75000:1000", floor = 300, slew_per_s = 50, max_age_ms = 3000 }
