# The B14 fan-control rehearsal's board for `lemnosd --sim`, the FILE phase: the curve is checked against a
# file-backed thermal zone. testing/fan-control/b14.sh replaces @FAN@ and @ZONE@ with its scratch paths. The
# fan is a fake (testing/crates/fake-devices, fake-fan) on the same contract and device id as the board's.
# The zone is the thermal-zone driver on a directory the script writes: `temp` in millidegrees, exact.
format = "lemnos.board"
schema_version = 1

[board]
id = "b14-sim-file"

# A fan that takes a duty per mille and reports it back. It starts at its baseline, 702 per mille (pwm1
# 179 on the board), the duty the controller's take-over records. Its duty is kept in the file @FAN@, and a
# refused write is logged beside it (`@FAN@.failures`): check 11 reads that.
[[devices]]
id = "fan"
driver = "fake-fan"
config = { duty = 702, file = "@FAN@" }

# The curve's zone: a directory with a `temp` file, written by the script (the file-backed zone).
[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
config = { path = "@ZONE@" }

[[devices]]
id = "fan-control"
driver = "fan-control"
uses = { fan = "fan", t0 = "cpu-thermal" }
config = { curve_t0 = "30000:300,60000:600,75000:1000", floor = 300, slew_per_s = 50, max_age_ms = 3000 }
