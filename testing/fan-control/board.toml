# The B14 fan-control board on the bench board, the FILE phase: the curve, slew, hold and fault checks run
# against a file-backed thermal zone. The script writes `temp` in /run/lemnos-b14/zone, in millidegrees, so the
# temperatures are exact. The real zone is checked in the REAL phase (board-real.toml).
#
# The curve is 42 to 58 C (FAN-RELEASE, B14.md): the board idles at 39 to 40 C and four cores of load
# plateau at 58 to 60 C, so the record's 20, 30, 61, 70 and 75 C points cannot be reached here.
format = "lemnos.board"
schema_version = 1

[board]
id = "bench-fan-file"

[[devices]]
id = "fan"
driver = "hwmon-fan"
config = { name = "pwmfan" }

[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
config = { path = "/run/lemnos-b14/zone" }

[[devices]]
id = "fan-control"
driver = "fan-control"
uses = { fan = "fan", t0 = "cpu-thermal" }
config = { curve_t0 = "42000:300,50000:600,58000:1000", floor = 300, slew_per_s = 50, max_age_ms = 3000 }
