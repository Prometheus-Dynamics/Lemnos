# The test's drop-in for the packaged daemon (never shipped): the daemon on CPU 1, where the competitors run; the
# start trace on; and the boot chain stood in (an x86 guest has no device tree; see docs/daemon.md, testing-boot-roots).
[Service]
CPUAffinity=1
Environment=LEMNOSD_START_TRACE=1 LEMNOSD_TEST_BOOT_ROOTS=/usr/lib/lemnos-guest/boot-roots/chosen:/usr/lib/lemnos-guest/boot-roots/sys:/dev
