# The test's drop-in for the packaged daemon (never shipped): the boot chain stood in (an x86 guest has no device tree;
# testing-boot-roots, see docs/daemon.md). The daemon runs as the guest's lemnos (uid 900), its own drop to lemnos.
[Service]
Environment=LEMNOSD_TEST_BOOT_ROOTS=/usr/lib/lemnos-guest/boot-roots/chosen:/usr/lib/lemnos-guest/boot-roots/sys:/dev
