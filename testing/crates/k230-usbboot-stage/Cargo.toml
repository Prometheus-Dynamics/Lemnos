[package]
name = "lemnos-k230-usbboot-stage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The K230 USB-boot stage's logic: the wire format, the watchdog's registers and their model, the medium trait and the stage's state machine, and the FL1 flash stage on the K230. no_std, no unsafe"

[lints]
workspace = true

[dependencies]
sha2 = { version = "0.11", default-features = false }
# The FL1 flash wire and the shared stage rules (drivers/flash-wire, drivers/flash-stage). The K230 stage's
# controllers (guard, storage, usb, report) are adapters under `fl1`; the rules are not copied here.
lemnos-flash-wire = { path = "../../../drivers/flash-wire" }
lemnos-flash-stage = { path = "../../../drivers/flash-stage" }
