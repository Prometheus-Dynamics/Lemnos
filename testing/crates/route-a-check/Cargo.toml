[package]
name = "lemnos-route-a-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The route-A check, test only: the real lemnosd under the packaged unit's launcher with system-slots on another system's boot records and on ours, run in the QEMU guest"

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../../engine/core", features = ["std"] }
lemnos-client = { path = "../../../engine/client" }
lemnos-daemon-ready = { path = "../daemon-ready" }
lemnos-driver-system-slots = { path = "../../../drivers/system-slots" }
lemnos-slot-store = { path = "../../../drivers/slot-store", features = ["testing"] }
