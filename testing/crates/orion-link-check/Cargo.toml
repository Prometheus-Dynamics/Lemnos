[package]
name = "lemnos-orion-link-check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Board-check in the QEMU harness: the real lemnosd and the real lemnos-orion bridge, a comm core and a host session over the emulated USB bus, end to end"

[lints]
workspace = true

# The bounce trace (src/trace.rs): off by default, on with the `trace` feature (LINK_CHECK_TRACE=1 in run.sh).
[features]
trace = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"], optional = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
lemnos-client = { path = "../../../engine/client" }
lemnos-daemon-ready = { path = "../daemon-ready" }
lemnos-host = { path = "../../../engine/host" }
lemnos-linux-sys = { path = "../../../backends/linux-sys" }
# The setting the bridge is started with comes from the tool an image builder runs: `tree --bridge-env`.
lemnos-ctl = { path = "../../../service/ctl" }
# The comm core and the host's session, from the one pinned Orion the bridge uses (service/orion).
orion-connect = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-msg-session = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-wire = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-server = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-link-usb = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-link-serial = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-unix = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-hello = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
orion-keys = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "b76a039cb202f0506bc7b2272a62fe9b5d584795" }
