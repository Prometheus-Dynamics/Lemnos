[package]
name = "lemnos-k230-usbboot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The K230 USB-boot host: the boot ROM's download mode and the vendor burner's protocol over USB, the flasher's write order, and a simulated board that runs the stage's own code. Opens no device; the tests drive the simulator"

[lints]
workspace = true

[dependencies]
lemnos-k230-usbboot-stage = { path = "../../../drivers/k230-usbboot-stage" }
# The B2 check: the check build's run and its dwc2 driver (run over a register model in the rehearsal),
# the shared stage's descriptors and the wire's frames.
lemnos-driver-k230-usbboot-sys = { path = "../../../drivers/k230-usbboot-sys", features = ["ep0-trace"] }
lemnos-flash-stage = { path = "../../../drivers/flash-stage" }
lemnos-flash-wire = { path = "../../../drivers/flash-wire" }
sha2 = { version = "0.11", default-features = false }
rusb = "0.9"
# The console tty's line settings (speed, raw, echo off) through a safe API: no unsafe in this crate.
rustix = { version = "1", features = ["termios", "pty", "fs"] }

[dev-dependencies]
lemnos-scratch = { path = "../scratch" }
