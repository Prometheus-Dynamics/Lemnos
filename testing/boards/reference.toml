# The reference board: a compute module on its IO board, shaped as a managed board is. It has an
# addressable LED strip on the PIO block, an IMU on a PIO I2C bus, a magnetometer and a power
# monitor on i2c-1, a camera (sensor, receiver, PiSP front and back end) on the camera I2C bus, a
# power switch for the camera, a fan on the fan header's PWM channel, the board as a USB gadget, the
# hardware watchdog as the daemon's keep-alive, and the system identity, slots and reboot devices.
# Its overlay, boot fragment and module configuration are made from this file by `lemnos-ctl tree`.
format = "lemnos.board"
schema_version = 1

[board]
id = "reference"
soc = "bcm2712-rp1"
base = "module-io"

# The hardware the devices below use. Each entry is the one place its pins are written.
[[hardware]]
name = "i2c-1"
controller = "i2c1"
pins = "gpio2_3"

# The camera and display connector's bus: RP1 I2C at 0x88000, on GPIO38 and GPIO39.
[[hardware]]
name = "i2c-10"
controller = "i2c10"
pins = "gpio38_39"

[[hardware]]
controller = "pwm1"
pins = "gpio45"

# The camera receiver is driven by the kernel module, so the module owns its node and the stock
# receiver driver is kept off it.
[[hardware]]
controller = "csi0"
module = "owned"

# The PiSP back end: the module drives it, as the `pisp_be` role.
[[hardware]]
controller = "pisp-be"
module = "pisp_be"

[[hardware]]
controller = "pio"

# The board as a USB device: the SoC's controller in peripheral mode, as the UDC.
[[hardware]]
name = "udc:1000480000.usb"
controller = "usb"

# The hardware watchdog, named by the devices that use it as `watchdog:<node>`.
[[hardware]]
controller = "watchdog"

# The lines the board gives to Lemnos, by their stable names. The camera regulator's line is held
# by a base node, which the overlay disables; the power switch below drives it. The fan header's
# line is at its full-speed level from power-on, until the fan's driver takes the PWM.
[[lines]]
line = "gpio:pinctrl-rp1:34"

[[lines]]
line = "gpio:pinctrl-rp1:45"
boot = "high"
reason = "the fan header's line: at full speed from power-on, until Lemnos's fan driver takes it"

# The system: who the board is, what it can install and boot, and reboot.
[[devices]]
id = "identity"
driver = "system-identity"
config = { serial = "device-tree" }

[[devices]]
id = "slots"
driver = "system-slots"
config = { data = "/data", boot = "/boot/firmware", record = "tryboot", keys = "/etc/lemnos/slot-keys", boot_args = "os", require_signed = false, reserve_mb = 2048, keep = 3 }

[[devices]]
id = "reboot"
driver = "system-reboot"

# The daemon's keep-alive: the hardware watchdog, set to 15 s. The daemon feeds it only while it is
# healthy. The device names the node by its device-tree path, which the generator enables.
[[devices]]
id = "watchdog"
driver = "hw-watchdog"
keepalive = true
uses = { watchdog = "watchdog:/soc@107c000000/watchdog@7d200000" }
config = { timeout_s = 15 }

# The board as a USB device: the gadget's functions, its identity from the system identity device.
[[devices]]
id = "gadget"
driver = "usb-gadget"
uses = { function = "udc:1000480000.usb" }
config = { vendor = 0x1209, product = 0x0001, manufacturer = "Lemnos", product_name = "Lemnos board", identity = "identity", interfaces = "function ffs\ninterface 0xff 0 0 pipe\nendpoint in bulk\nendpoint out bulk\nfunction ncm derive\nfunction acm\n" }

# The LED strip on the PIO block: 16 SK6812-EC20 on GPIO13, 24 bits per LED on the wire, as the
# product's overlay states (`ws2812-pio,gpio=13,num_leds=16`, 2026-11-13). The pixel order GRB is
# the product's own: this driver takes only the wire width ("rgb" or "rgbw"), so the colour order is
# unverified here and not readable without lighting the ring.
[[devices]]
id = "ring"
driver = "ws2812"
bus = "pio-out:gpio=13"
config = { count = 16, wire = "rgb", brightness = 255 }

# The IMU, on the PIO block's I2C bus.
[[devices]]
id = "imu"
driver = "bmi088"
bus = "pio-i2c:sda=8,scl=7"
config = { accel_rate = 200, gyro_rate = 200, fifo = false }

# The magnetometer: a BMM150 at 0x10 on i2c-1, the same bus as the power monitor. Read on the board
# (2026-11-13): register 0x40 reads 0x32, the BMM150 chip ID. It is NOT on the PIO bus.
[[devices]]
id = "mag"
driver = "bmm150"
bus = "i2c-1"
config = { address = 0x10 }

# The power monitor on i2c-1: an INA238-family chip at 0x40. Read on the board (2026-11-13):
# manufacturer ID 0x5449, device ID register 0x2381. The shunt is NOT readable from the board: the
# device tree names no shunt-resistor and the shunt calibration register is at its reset value. The
# 0.010 ohm below is from the earlier run and the product's manifest (unverified against the schematic).
[[devices]]
id = "power"
driver = "ina2xx"
bus = "i2c-1"
config = { chip = "ina238", address = 0x40, shunt_ohms = 0.010, max_current_a = 2.0 }

# The camera: the sensor on the camera bus, linked to the receiver, which is linked to the PiSP
# front end, which is linked to the back end. The power switch powers the sensor's regulator.
[[devices]]
id = "cam0-power"
driver = "gpio-power-switch"
uses = { line = "gpio:pinctrl-rp1:34" }
config = { default_on = true }

# The sensor's clock: the product's overlay is `ov9782,cam0,clk-continuous` (config.txt on the board,
# 2026-11-13), so the continuous clock. The sensor modes the driver offers are 1280x800, 1280x720 and
# 640x400 (binned), each RAW10 and RAW8. The camera streams below run mode 0 (1280x800 RAW10, the
# first entry of the driver's mode table), and their formats are this file's own choices (the back
# end's outputs are NV12, the front end's are BAYER16): the product does not state them here.
# Each buffer size is derived in its comment, and `pisp_reference_sizes` in
# `testing/crates/camera-proof/tests/reference_board.rs` recomputes every one from the drivers.
[[devices]]
id = "cam0-sensor"
driver = "ov9782"
bus = "i2c-10"
link = "cam0-receiver"
config = { continuous_clock = true }

# The sensor's values: jobs of one encoded `FrameValues` each, read from the stream's job queue.
# 2 of 64 bytes: `ov9782::JOB_BYTES`, the bytes a job reads. The sensor has no embedded data
# (`chip::EMBEDDED_DATA` is None), so the receiver below has no `embedded` stream.
[devices.streams.values]
buffers = 2
buffer_bytes = 64
job_bytes = 64

# The receiver is the kernel module's: the module owns its node, and this device is its driver's.
[[devices]]
id = "cam0-receiver"
driver = "rp1-csi2"
link = "cam0-fe"
config = { device = "1f00110000.csi" }

# 8 of 1280000 bytes: RAW10 packed, 1280 wide is 1600 bytes a line (1280 x 10 / 8, already a
# multiple of 16), and 800 lines make 1280000 (`rp1_csi2::packed_frame_bytes(1280, 800, 10)`).
[devices.streams.frames]
buffers = 8
buffer_bytes = 1280000
memory = "dma-buf"
heap = "linux,cma"

[[devices]]
id = "cam0-fe"
driver = "pisp-fe"
link = "cam0-isp"
config = { device = "1f00110000.csi", lanes = 2, mbps = 800, data_type = 0x2b, job_slots = 8 }

# 8 of 632 bytes: one front-end configuration (`fe_job::CONFIG_BYTES`, `FeConfig::SIZE`), per job.
[devices.streams.config]
buffers = 8
buffer_bytes = 632
job_slots = 8
job_bytes = 128

# 8 of 23200 bytes: one statistics block (`fe_job::STATS_BYTES`, `RawStatistics::SIZE`), per job.
[devices.streams.statistics]
buffers = 8
buffer_bytes = 23200
memory = "dma-buf"
heap = "linux,cma"

# 4 of 2052096 bytes: BAYER16 at 1280 x 800. Its stride is 2560 (2 bytes a pixel, aligned to 64,
# `FE_OUTPUT_ALIGN`), so 2560 x 800 = 2048000, plus a 4096-byte pad: the jobs' `pad_bytes`.
[devices.streams.output0]
buffers = 4
buffer_bytes = 2052096
memory = "dma-buf"
heap = "linux,cma"

# 4 of 516096 bytes: BAYER16 at 640 x 400, half the mode. Stride 1280 x 400 = 512000, plus the
# same 4096-byte pad.
[devices.streams.output1]
buffers = 4
buffer_bytes = 516096
memory = "dma-buf"
heap = "linux,cma"

[[devices]]
id = "cam0-isp"
driver = "pisp-be"
config = { device = "1000880000.pisp_be" }

# 2 of 16720 bytes: one back-end configuration per job (`CONFIG_BYTES`, the block's own size).
[devices.streams.config]
buffers = 2
buffer_bytes = 16720
job_slots = 8
job_bytes = 128

# 2 of 2048000 bytes: the raw frame the job reads, BAYER16 at 1280 x 800 with a 64-aligned stride of
# 2560 (`BE_INPUT_ALIGN`): 2560 x 800 = 2048000.
[devices.streams.input]
buffers = 2
buffer_bytes = 2048000
memory = "dma-buf"
heap = "linux,cma"

# 4 of 1536000 bytes: NV12 at 1280 x 800. Stride 1280 (16-aligned, `BE_OUTPUT_MIN_ALIGN`), luma
# 1280 x 800 = 1024000, chroma 1280 x 400 = 512000.
[devices.streams.output0]
buffers = 4
buffer_bytes = 1536000
memory = "dma-buf"
heap = "linux,cma"

# 4 of 384000 bytes: NV12 at 640 x 400, half the mode. Luma 640 x 400 = 256000, chroma 640 x 200 =
# 128000.
[devices.streams.output1]
buffers = 4
buffer_bytes = 384000
memory = "dma-buf"
heap = "linux,cma"

# The fan on the fan header's PWM channel, driven directly, with no kernel fan driver between.
# Read on the board (2026-11-13): the product's pwm-fan node (/cooling_fan) takes channel 3 of the
# RP1 PWM at pwm@9c000 (pin 45, function pwm1), with period 41566 ns, which is 24057 Hz rounded.
[[devices]]
id = "fan"
driver = "pwm-channel-fan"
uses = { pwm = "pwm:/axi/pcie@1000120000/rp1/pwm@9c000:3" }
config = { frequency_hz = 24057, min_duty = 200, kick_ms = 500 }

# The board's temperature, and the fan control that runs the fan from it. Neither names hardware:
# the thermal zone is read through sysfs, and the fan control is built from the devices above.
[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
config = { path = "/sys/class/thermal/thermal_zone0" }

[[devices]]
id = "fan-control"
driver = "fan-control"
uses = { fan = "fan", t0 = "cpu-thermal" }
config = { curve_t0 = "30000:300,60000:600,75000:1000", floor = 300, slew_per_s = 50 }
