# The kernel options a slot board must be built with. This file is the machine-read source of the
# "Slot board: built in" table in docs/kernel-config.md: scripts/check-kernel-config.py checks the table
# and the two harness kernel configurations against it, and an image builder reads it from the locked tree.
#
# Names are written without the CONFIG_ prefix: BLOCK is CONFIG_BLOCK.
#
# Reading rules, for any build that reads this file:
#   - version must be 3 (version 1 had no [firmware] table; version 2 had no EROFS_FS_ZIP). Any other value:
#     refuse the file. [crash_log] is an additive, optional group at version 3 (see below): no version bump.
#   - A key this reader does not know, at any level, is refused too: it means a newer version.
#     Every key below is required at its level, except the groups named as optional below.
#     The one optional group is [crash_log]: a reader that knows it must accept it, and a board that does
#     not declare a crash-log region does not need its symbols.
#   - A build for image kind K checks exactly these, from this file:
#       always.all                       each symbol =y on every slot board
#       kind.K.all                       each symbol =y for the kind K
#       kind.K.one_of                    each inner list: at least one of its symbols =y
#       initramfs.<compression>          the decompressor symbol =y for the image's initramfs compression
#                                        ("" means none: the initramfs is not compressed, no symbol)
#   - crash_log.all                  each symbol =y (built in: =m or unset is refused) for a board that declares a
#                                    crash-log region (`crash_log` in its slot device's config, docs/slots.md, "The
#                                    crash log"). ramoops in a reserved region, its console and dmesg records. Named
#                                    here, not required of every board: a board with no region does not need them.
#   - firmware.F.all                 each symbol =y (built in: =m or unset is refused, naming the symbol) for a
#                                    board whose firmware family is F. The one family is "rpi-tryboot": the
#                                    Raspberry Pi firmware family, whose slot-init asks the firmware for its
#                                    flashing mode through /dev/vcio (the property mailbox), which devtmpfs
#                                    makes (DEVTMPFS is in always.all; no static node is ever in the image).
#                                    From the Pi kernel tree (rpi-7.2.y): BCM_VCIO (drivers/char/broadcom/
#                                    Kconfig, tristate, depends on BCM2835_MBOX, inside the bool menuconfig
#                                    BRCM_CHAR_DRIVERS), BCM2835_MBOX (drivers/mailbox/Kconfig, depends on
#                                    ARCH_BCM2835, inside the bool menuconfig MAILBOX) and RASPBERRYPI_FIRMWARE
#                                    (drivers/firmware/Kconfig, depends on MAILBOX; vcio.c calls its
#                                    rpi_firmware_property_list). The checker: scripts/check-kernel-config.py
#                                    --check-config <.config> --firmware rpi-tryboot.
#   - watchdog.all                   each symbol =y (built in: =m or unset is refused) on every slot board, and
#                                    watchdog.open_timeout_s is CONFIG_WATCHDOG_OPEN_TIMEOUT (=30 exactly). Named in
#                                    [watchdog] below: the kernel's watchdog chain, docs/slots.md, "The watchdog chain".
#   - watchdog.family.F.driver       each symbol =y for a board whose SoC is in watchdog.family.F.socs (a slot family).
#                                    The checker: scripts/check-kernel-config.py --check-config <.config> --watchdog F.
#   - optional.all is named, not enforced: a missing one is logged and the boot carries on.
#   - boot_check.checked is the set of symbols slot-init checks when it boots and names when one is
#     absent. It must equal the names slot-init's self-check gives.
#   - The image kinds are the first-flash image kinds: "disk" (a slot image is a file on the ext4 data
#     partition, attached through a loop device) and "mtd" (raw NAND: the slot image is a UBI volume,
#     read through a ubiblock device, and the data is on UBIFS). A raw-NAND board needs neither
#     kind.disk.* (no storage block device holds its data, and it uses neither ext4 nor a loop device).
#   - Per-SoC storage hosts (for example MMC_SDHCI_BRCMSTB) are not here: they are board data.
#     MODULES is not required and is not listed: slot-init loads no modules.

# [watchdog] (version 3, additive): the watchdog the kernel and slot-init share; see the table above.
# What changed from version 2: always.all gains EROFS_FS_ZIP. slot-init mounts the slot's root as an EROFS
# image, usually compressed (EROFS_FS was already listed). From the kernel tree (linux 7.3.3, fs/erofs/
# Kconfig): EROFS_FS depends on BLOCK (listed) and selects LZ4_DECOMPRESS when EROFS_FS_ZIP is set;
# EROFS_FS_ZIP (bool, default y) depends on EROFS_FS. The image's compression ALGORITHM is the image
# builder's choice and is NOT in this contract: the builder must check that the kernel has the built-in
# decompressor for the algorithm its recipe used (LZ4 comes with EROFS_FS_ZIP; EROFS_FS_ZIP_LZMA,
# EROFS_FS_ZIP_DEFLATE or EROFS_FS_ZIP_ZSTD for the others, each =y). The dm-verity chain the root needs
# (BLK_DEV_DM, DM_BUFIO, DM_VERITY, CRYPTO, CRYPTO_SHA256) was already listed. A root that cannot be mounted
# (the kernel lacks the decompressor) is a slot failure like any unreadable root: see docs/slots.md.
# The [crash_log] table is additive at version 3: it adds a group a board that declares a crash-log region
# requires, and changes no existing group. From the kernel tree (linux 7.3.3, fs/pstore/Kconfig): PSTORE
# (tristate, default n) is the pstore file system; PSTORE_RAM (tristate, depends on PSTORE) is ramoops, the
# region reserved in RAM across a warm reset; PSTORE_CONSOLE (bool) keeps the console in it. All three are =y
# where a board declares a region: a slot board runs no modules (slot-init loads none), so a module would never
# be read.
version = 3

[always]
all = [
  "BLOCK",
  "BLK_DEV_DM",
  "DM_BUFIO",
  "DM_VERITY",
  "CRYPTO",
  "CRYPTO_SHA256",
  "EROFS_FS",
  "EROFS_FS_ZIP",
  "DEVTMPFS",
  "PROC_FS",
  "SYSFS",
  "BLK_DEV_INITRD",
]

[kind.disk]
all = [
  "EXT4_FS",
  "BLK_DEV_LOOP",
]
one_of = [
  ["MMC_BLOCK", "BLK_DEV_NVME"],
]

[kind.mtd]
all = [
  "MTD_UBI",
  "UBIFS_FS",
  "MTD_UBI_BLOCK",
]
one_of = []

[crash_log]
# Optional and additive (version 3): required only of a board that declares a crash-log region.
all = [
  "PSTORE",
  "PSTORE_RAM",
  "PSTORE_CONSOLE",
]

[firmware.rpi-tryboot]
all = [
  "BRCM_CHAR_DRIVERS",
  "MAILBOX",
  "BCM2835_MBOX",
  "BCM_VCIO",
  "RASPBERRYPI_FIRMWARE",
]

[optional]
all = [
  "VFAT_FS",
]

# The watchdog (additive at version 3, like [crash_log]: a reader that knows it must accept it).
# The numbers slot-init and the image builder share: slot-init asks for request_s seconds and holds a
# device whose applied period is at most max_applied_s (see service/slot-init/src/dog.rs, which states
# the derivation). A device applying more, or 0, is a named refusal, and a board whose declared period
# (the hw-watchdog device's timeout_s in its board file) is outside [1, max_applied_s] is refused by
# lemnos-ctl validate with reason watchdog-period-outside-bound.
# open_timeout_s is CONFIG_WATCHDOG_OPEN_TIMEOUT: 30 s from the watchdog driver's probe to the first open,
# which slot-init makes early in its initramfs (docs/kernel-config.md, "Watchdog").
[watchdog]
all = [
  "WATCHDOG",
  "WATCHDOG_CORE",
  "WATCHDOG_HANDLE_BOOT_ENABLED",
]
request_s = 15
max_applied_s = 30
open_timeout_s = 30

[watchdog.family.bcm2712]
# The Raspberry Pi 5 family: the Broadcom watchdog (bcm2835_wdt; its maximum is 15 s).
socs = ["bcm2712-rp1"]
driver = ["BCM2835_WDT"]

[watchdog.family.rk35xx]
# Rockchip RK3566 and RK3588: the Synopsys DesignWare watchdog (dw_wdt, power-of-two periods).
socs = ["rk3566", "rk3588"]
driver = ["DW_WATCHDOG"]

[watchdog.family.sun60i]
# Allwinner A733 (sun60i): the always-on watchdog (sunxi_wdt; its maximum is 16 s). A longer period is served only with the
# family's series patch sunxi-wdt-heartbeat, carried by the whole series at its pinned rev fe0a8ed3 (patches/series:543;
# PC-side repo family.toml:108). The sun60i OPEN_TIMEOUT=30 is in the PC-side repo's pr/C1 (linux.fragment:83), not on its next.
socs = ["sun60i-a733"]
driver = ["SUNXI_WATCHDOG"]

[initramfs]
gzip = "RD_GZIP"
xz = "RD_XZ"
zstd = "RD_ZSTD"
lz4 = "RD_LZ4"
none = ""

[boot_check]
checked = [
  "BLK_DEV_DM",
  "DM_VERITY",
  "CRYPTO_SHA256",
  "EROFS_FS",
  "EXT4_FS",
  "BLK_DEV_LOOP",
  "VFAT_FS",
  "MMC_BLOCK",
  "BLK_DEV_NVME",
  "MTD_UBI",
  "UBIFS_FS",
]
