# The managed USB link identity: what every gadget this project builds presents to a host.
#
# Read by the tests of drivers/usb-gadget (tests/link_contract.rs), which fail if the code's
# constants and this file disagree, and by other teams' tests and device data instead of copying
# the numbers. A reader refuses a version it does not know and any key it does not know.
# Changing an identity value here means changing the constant it matches; the tests say which.
#
# Versions: 1 is the identity as published with the link's descriptors (R1h, #307). 2 adds the
# `[composition]` table (the default `interfaces` text). 3 adds the `[network]` table (the board-side
# interface name of the default composition). A reader knows the versions it was built for and refuses
# any other. Any key added later is a new version, never a key added to an old one.
version = 3

[device]
vendor = 0x1d6b          # PLACEHOLDER until the user settles a product id; see docs/boards.md
product = 0x0104         # PLACEHOLDER, as above
bcd_device = 0x0200      # the release presented now; only ever rises (drivers/usb-gadget revision.rs)
class = 0xef             # composite, with interface association descriptors
subclass = 0x02
protocol = 0x01

[link]
interface_string = "orion-link"  # the vendor interface's name; the host matches VID:PID, then this
class = 0xff
subclass = 0x00
protocol = 0x00
interface = 0                    # the link is interface 0 of the composite: first function, no IAD
property = "DeviceInterfaceGUID" # the singular REG_SZ property (MS OS 1.0, extended properties)
guid = "{CF13388F-BE34-4A1E-94C2-9AAFEF9A04E9}"
compatible_id = "WINUSB"

[functions.ncm]
compatible_id = "WINNCM"         # NCM control interface; not in Microsoft's list (untested)

[functions.acm]
compatible_id = ""               # none: in-box usbser needs no OS descriptor

# The composition a board gets when its `interfaces` setting is absent. The driver's default is this
# text exactly (a test in drivers/usb-gadget checks it). A board that gives `interfaces` deviates
# from it, and a text whose first interface is not the vendor-class link is refused.
[composition]
default = """
function ffs
interface 0xff 0 0 orion-link
endpoint in bulk
endpoint out bulk
function ncm derive ifname=lemnos%d
function acm
"""

# The name of the NETWORK INTERFACE THE BOARD HAS for the default composition's NCM function: the
# gadget function's own netdev (its configfs `functions/ncm.usb0/ifname`, set from the `ifname=` of the
# `function ncm` line above), not the interface the host sees. An image's address and DHCP files and its
# bridge files must name `board_interface`. The kernel replaces the one `%d` of the template with the
# first free number, so the first gadget gets `lemnos0`. A board file that gives its own `interfaces`
# without `ifname=` gets the kernel's `usb<N>` instead, and its image must name that. A test in
# drivers/usb-gadget ties the template to the `ifname=` of the default composition above.
[network]
board_interface_template = "lemnos%d"
board_interface = "lemnos0"

[os]
vendor_code = 0x51               # bMS_VendorCode for the Microsoft OS 1.0 requests
qw_sign = "MSFT100"              # string 0xEE

# bcdDevice reservations. The managed identity keeps 1d6b:0104 and its releases in the managed range
# until the user settles a product id; another team's bring-up images use 1d6b:0103 from the other
# range. Releases only ever rise inside a range.
[reservation.managed]
vendor = 0x1d6b
product = 0x0104
bcd_min = 0x0100
bcd_max = 0x0aff

[reservation.other]
vendor = 0x1d6b
product = 0x0103
bcd_min = 0x0b00
bcd_max = 0xffff
