name: Next

on:
  push:
    branches:
      - next
    # The gate runs the documents' commands and checks their links, so a document counts.
    paths-ignore:
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# scripts/gate.sh runs in parts: the checks, and four shards of the workspace tests. The gate job at
# the end is the one check to require: it passes only when every part passed.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain is rust-toolchain.toml's pin, with its components and targets, as the default,
      # and the only one installed. `dtolnay/rust-toolchain@stable` installed and defaulted the current
      # stable, which no build used (the pin overrides it in the checkout), and the image ships a stable
      # too; rust-cache hashes every installed rustc into its key, so each stable release moved the key
      # and left a cold cache (run 46110419435 listed 1.100.1 beside 1.99.0).
      - name: Rust toolchain (the pin in rust-toolchain.toml, alone)
        run: |
          read -r pin components targets < <(python3 -c '
          import tomllib
          t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]
          print(t["channel"], ",".join(t.get("components", [])) or "-", ",".join(t.get("targets", [])) or "-")')
          args=(--profile minimal --no-self-update)
          [ "$components" = - ] || args+=(--component "$components")
          [ "$targets" = - ] || args+=(--target "$targets")
          rustup toolchain install "$pin" "${args[@]}"
          rustup default "$pin"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in "$pin"-*) ;; *) rustup toolchain uninstall "$tc" ;; esac
          done
      # The active rustc is the pin, in the checkout and outside it (the default), and the only
      # toolchain installed, or the job stops.
      - name: The active rustc is the pin, alone
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          default=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustc -vV
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$default" = "$pin" ] || {
            echo "::error::active rustc $here (default $default), rust-toolchain.toml pins $pin"; exit 1; }
          others=$(rustup toolchain list | awk '{print $1}' | grep -v "^$pin-" || true)
          [ -z "$others" ] || { echo "::error::toolchains beside the pin $pin: $others"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: next-checks
      # dtc: the documents and devtree checks may run the dtc on PATH, as the single gate job did.
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      # The mdev check (testing/mdev/check.sh) runs the BusyBox 1.37.0 and 1.38.0 mdev, built from their
      # release tarballs (sha256 pinned in testing/mdev/build-busybox.sh) with zig as the C compiler: the
      # pinned ziglang wheel, in a venv of its own.
      - run: python3 -m venv "$RUNNER_TEMP/zig" && "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.15.2
      # Cached on the build script, as the kernel job caches its build: a warm cache builds nothing.
      - uses: actions/cache/restore@v4
        id: busybox
        with:
          path: ${{ runner.temp }}/busybox
          key: busybox-${{ hashFiles('testing/mdev/build-busybox.sh') }}
      - run: |
          testing/mdev/build-busybox.sh "$RUNNER_TEMP/busybox/1.37.0" 1.37.0
          testing/mdev/build-busybox.sh "$RUNNER_TEMP/busybox/1.38.0" 1.38.0
        env:
          ZIG_CC: ${{ runner.temp }}/zig/bin/python -m ziglang cc
      - uses: actions/cache/save@v4
        if: steps.busybox.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/busybox
          key: ${{ steps.busybox.outputs.cache-primary-key }}
      # The U-Boot check (testing/uboot/check.sh) runs stock U-Boot v2026.10 (the Raspberry Pi 64-bit defconfig, built from
      # its pinned release tarball, sha256 in testing/uboot/build-uboot.sh) under QEMU's raspi3b, with the disk image as the
      # SD card. It needs the aarch64 cross compiler, QEMU, mtools and dosfstools (the FAT partition), and device-tree-compiler
      # (fdtput and dtc). Cached on the build script, as the BusyBox builds are.
      - run: sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm mtools dosfstools device-tree-compiler
      - uses: actions/cache/restore@v4
        id: uboot
        with:
          path: ${{ runner.temp }}/uboot
          key: uboot-${{ hashFiles('testing/uboot/build-uboot.sh') }}
      - run: testing/uboot/build-uboot.sh "$RUNNER_TEMP/uboot" 2026.10
      - uses: actions/cache/save@v4
        if: steps.uboot.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/uboot
          key: ${{ steps.uboot.outputs.cache-primary-key }}
      - run: ./scripts/gate.sh
        env:
          GATE_PART: checks
          BUSYBOX_DIR: ${{ runner.temp }}/busybox
          UBOOT_DIR: ${{ runner.temp }}/uboot
          ZIG_CC: ${{ runner.temp }}/zig/bin/python -m ziglang cc

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: tests ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
      # The toolchain is rust-toolchain.toml's pin, with its components and targets, as the default,
      # and the only one installed. `dtolnay/rust-toolchain@stable` installed and defaulted the current
      # stable, which no build used (the pin overrides it in the checkout), and the image ships a stable
      # too; rust-cache hashes every installed rustc into its key, so each stable release moved the key
      # and left a cold cache (run 46110419435 listed 1.100.1 beside 1.99.0).
      - name: Rust toolchain (the pin in rust-toolchain.toml, alone)
        run: |
          read -r pin components targets < <(python3 -c '
          import tomllib
          t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]
          print(t["channel"], ",".join(t.get("components", [])) or "-", ",".join(t.get("targets", [])) or "-")')
          args=(--profile minimal --no-self-update)
          [ "$components" = - ] || args+=(--component "$components")
          [ "$targets" = - ] || args+=(--target "$targets")
          rustup toolchain install "$pin" "${args[@]}"
          rustup default "$pin"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in "$pin"-*) ;; *) rustup toolchain uninstall "$tc" ;; esac
          done
      # The active rustc is the pin, in the checkout and outside it (the default), and the only
      # toolchain installed, or the job stops.
      - name: The active rustc is the pin, alone
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          default=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustc -vV
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$default" = "$pin" ] || {
            echo "::error::active rustc $here (default $default), rust-toolchain.toml pins $pin"; exit 1; }
          others=$(rustup toolchain list | awk '{print $1}' | grep -v "^$pin-" || true)
          [ -z "$others" ] || { echo "::error::toolchains beside the pin $pin: $others"; exit 1; }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: next-tests-${{ matrix.shard }}
      # dtc: the device-tree loader tests (service/devtree/tests/apply.rs) run the dtc on PATH.
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      # dtmerge (shard 1, which holds lemnos-ctl: scripts/gate.sh): the real tool, built from raspberrypi/utils at a pinned commit (3f5fa2965292168b7e428976044f1ac2da50130a,
      # dtmerge: security fixes for dtoverlay.c, 2026-11-02): the dtmerge/ directory alone, which needs libfdt.
      # The host-merge tests in service/ctl/tests/firmware_overlays.rs run it through LEMNOS_DTMERGE, and the
      # __overrides__ test runs only there (CI is set, so a missing tool fails the job).
      - run: sudo apt-get install -y libfdt-dev cmake
        if: matrix.shard == 1
      - name: Build dtmerge at the pinned commit
        if: matrix.shard == 1
        run: |
          git init -q "$RUNNER_TEMP/utils"
          git -C "$RUNNER_TEMP/utils" fetch -q --depth 1 https://github.com/raspberrypi/utils.git 3f5fa2965292168b7e428976044f1ac2da50130a
          git -C "$RUNNER_TEMP/utils" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/utils/dtmerge" -B "$RUNNER_TEMP/dtmerge-build"
          cmake --build "$RUNNER_TEMP/dtmerge-build" --target dtmerge
          echo "LEMNOS_DTMERGE=$RUNNER_TEMP/dtmerge-build/dtmerge" >> "$GITHUB_ENV"
      # The K230 USB-boot stage's entry is bare-metal RISC-V, which the gate's host build does not cover.
      - run: rustup target add riscv64imac-unknown-none-elf
      - run: cargo build -p lemnos-driver-k230-usbboot-sys -p lemnos-k230-usbboot-stage --target riscv64imac-unknown-none-elf
      - run: ./scripts/gate.sh
        env:
          GATE_PART: tests:${{ matrix.shard }}/4

  # The one check to require. It passes only when every part above passed.
  gate:
    name: gate
    needs: [checks, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.tests.result }}" = success
