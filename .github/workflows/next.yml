name: Next

on:
  push:
    branches:
      - next
    # The gate runs the documents' commands and checks their links, so a document counts.
    paths-ignore:
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain and its components.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dtc and fdtoverlay: the device-tree loader tests (service/devtree/tests/apply.rs) run them.
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      # The mdev check (testing/mdev/check.sh) runs the BusyBox 1.37.0 and 1.38.0 mdev, built from their
      # release tarballs (sha256 pinned in testing/mdev/build-busybox.sh) with zig as the C compiler: the
      # pinned ziglang wheel, in a venv of its own.
      - run: python3 -m venv "$RUNNER_TEMP/zig" && "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.15.2
      # Cached on the build script, as the kernel job caches its build: a warm cache builds nothing.
      - uses: actions/cache/restore@v4
        id: busybox
        with:
          path: ${{ runner.temp }}/busybox
          key: busybox-${{ hashFiles('testing/mdev/build-busybox.sh') }}
      - run: |
          testing/mdev/build-busybox.sh "$RUNNER_TEMP/busybox/1.37.0" 1.37.0
          testing/mdev/build-busybox.sh "$RUNNER_TEMP/busybox/1.38.0" 1.38.0
        env:
          ZIG_CC: ${{ runner.temp }}/zig/bin/python -m ziglang cc
      - uses: actions/cache/save@v4
        if: steps.busybox.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/busybox
          key: ${{ steps.busybox.outputs.cache-primary-key }}
      # The real dtmerge, built from raspberrypi/utils at a pinned commit (3f5fa2965292168b7e428976044f1ac2da50130a,
      # dtmerge: security fixes for dtoverlay.c, 2026-11-02): the dtmerge/ directory alone, which needs libfdt.
      # The host-merge tests in service/ctl/tests/firmware_overlays.rs run it through LEMNOS_DTMERGE, and the
      # __overrides__ test runs only there (CI is set, so a missing tool fails the job).
      - run: sudo apt-get install -y libfdt-dev cmake
      - name: Build dtmerge at the pinned commit
        run: |
          git init -q "$RUNNER_TEMP/utils"
          git -C "$RUNNER_TEMP/utils" fetch -q --depth 1 https://github.com/raspberrypi/utils.git 3f5fa2965292168b7e428976044f1ac2da50130a
          git -C "$RUNNER_TEMP/utils" checkout -q FETCH_HEAD
          cmake -S "$RUNNER_TEMP/utils/dtmerge" -B "$RUNNER_TEMP/dtmerge-build"
          cmake --build "$RUNNER_TEMP/dtmerge-build" --target dtmerge
          echo "LEMNOS_DTMERGE=$RUNNER_TEMP/dtmerge-build/dtmerge" >> "$GITHUB_ENV"
      - run: ./scripts/gate.sh
        env:
          BUSYBOX_DIR: ${{ runner.temp }}/busybox
          ZIG_CC: ${{ runner.temp }}/zig/bin/python -m ziglang cc
