name: CI

on:
  # Every push to the integration branch and to main. Docs-only pushes skip
  # the run: nothing a job checks changes with them.
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:00 UTC: the long jobs (sizes, cross32) that a push
    # does not run.
    - cron: "0 3 * * 0"

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same scripts as `./scripts/ci.sh`, so local runs and CI
# cannot drift apart. Jobs do not repeat each other's work: the workspace job
# owns the tests and the full-feature clippy, docs-and-lints the rest.
#
# Per push and pull request: workspace, docs-and-lints, feature-matrix, nostd.
# Manual dispatch and the weekly schedule add the long jobs: sizes (firmware
# and Linux size images) and cross32 (cross-built service binaries under qemu).
env:
  CARGO_INCREMENTAL: 0

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci.sh workspace

  docs-and-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci.sh docs-and-lints

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The entries of scripts/feature-matrix.sh (which documents which run
        # tests and which only clippy).
        name:
          - lemnos default
          - lemnos mock
          - lemnos mock builtin-drivers
          - lemnos mock builtin-drivers tokio
          - lemnos linux
          - lemnos linux builtin-drivers
          - lemnos linux gpio hotplug
          - lemnos linux lite
          - lemnos board mock
          - lemnos board linux
          - lemnos-core serde
          - lemnos-linux full (dma, v4l2-m2m)
          - lemnos-board linux
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
      - run: ./scripts/feature-matrix.sh "${{ matrix.name }}"

  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci.sh nostd

  sizes:
    # Long: firmware and Linux size images. Manual dispatch and weekly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
          targets: thumbv7em-none-eabihf, riscv32imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci.sh sizes

  cross32:
    # lemnosd and lemnos-ctl (the client) for the K230D (riscv64) and Flame (armv7) boards: the
    # service profile cross-built for riscv64gc-unknown-linux-gnu and armv7-unknown-linux-gnueabihf,
    # the stripped size of each reported, and lemnos-ctl run once under qemu-user.
    # Long: cross builds and a qemu run. Manual dispatch and weekly only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      - name: Install riscv64 and armhf cross compilers and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross libc6-riscv64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-static
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross32
      - run: ./scripts/ci.sh cross32
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64-static
          # The riscv64 cross libc is the qemu-user sysroot (also used by binfmt).
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
