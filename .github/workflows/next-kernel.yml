name: Next kernel module

on:
  push:
    branches:
      - next
    # The harness builds module-check, which links every contract and driver it checks, so a
    # change anywhere in the workspace can break it (M10: a contract's wire change did). Only
    # Markdown and the licence files are skipped; the QEMU harness reads none of them (M12).
    paths-ignore:
      - "**/*.md"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
    # The harness builds module-check, which links every contract and driver it checks, so a
    # change anywhere in the workspace can break it (M10: a contract's wire change did). Only
    # Markdown and the licence files are skipped; the QEMU harness reads none of them (M12).
    paths-ignore:
      - "**/*.md"
      - "LICENSE-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # apt packages from a cache of their .debs, keyed on the version below (only what is missing is downloaded).
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: qemu-system-x86 cpio flex bison bc libelf-dev libssl-dev dwarves clang lld llvm libclang-dev
          version: kernel-qemu-v1
      # The rustup toolchain (1.99.0 with rust-src, from rust-toolchain.toml), keyed on that file.
      - uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # The Rust kernel's toolchain: rustc and rust-src from rust-toolchain.toml (rustup installs it here),
      # bindgen-cli at the tested version (cached), and clang, lld and libclang for LLVM=1 and bindgen.
      - run: rustup show active-toolchain
      # The kernel build runs from the kernel's directory, where rust-toolchain.toml does not apply: pin the
      # toolchain (and so its rust-src) for every command in this job.
      - run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"
      - run: rustc -vV && rustup component list --installed | grep rust-src
      # The same pin as the Next workflow builds with (rust-toolchain.toml), in the checkout and as
      # RUSTUP_TOOLCHAIN for the kernel's directory, or the job stops.
      - name: The active rustc is the pin
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          kernel=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$kernel" = "$pin" ] && [ "$RUSTUP_TOOLCHAIN" = "$pin" ] || {
            echo "::error::rustc $here (outside the checkout $kernel, RUSTUP_TOOLCHAIN $RUSTUP_TOOLCHAIN), rust-toolchain.toml pins $pin"; exit 1; }
      # bindgen loads libclang from the clang package's directory: name it.
      - run: echo "LIBCLANG_PATH=$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so* | sort -V | tail -1)")" >> "$GITHUB_ENV"
      # bindgen-cli is cached as the binary, keyed on its version: no cargo install on a warm run.
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-cli-0.73.2-${{ runner.os }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked bindgen-cli --version 0.73.2
      - run: bindgen --version
      - name: Let the job use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        id: kernel
        with:
          path: ${{ runner.temp }}/kernel
          key: qemu-kernel-${{ hashFiles('testing/qemu/build-kernel.sh', 'testing/qemu/kernel.config') }}
      - run: testing/qemu/build-kernel.sh "$RUNNER_TEMP/kernel"
      # The required symbols of lemnos.ko, followed through this kernel's Kconfig files: a dependency
      # the build leaves unset must be listed in the doc (docs/kernel-config.md, Dependencies).
      - run: python3 scripts/check-kernel-config.py --tree "$RUNNER_TEMP/kernel/linux-7.3.5" --config "$RUNNER_TEMP/kernel/build/.config" --arch x86
      # Saved before the checks run, so a failing check doesn't cost the next run a kernel build.
      - uses: actions/cache/save@v4
        if: steps.kernel.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/kernel
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      # rust-toolchain.toml selects the toolchain.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: testing/qemu/run.sh
        env:
          KDIR: ${{ runner.temp }}/kernel/build
          KERNEL: ${{ runner.temp }}/kernel/build/arch/x86/boot/bzImage

  # The kernel for an image with no loadable modules: lemnos built in, module support off. A
  # flasher image depends on this configuration, so it runs on every change too. Its kernel is a
  # cache of its own: the build is keyed on the script and the fragment, so once the cache is warm
  # only kernel/ (copied in and built as drivers/misc/lemnos) recompiles.
  qemu-modules-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # apt packages from a cache of their .debs, keyed on the version below (only what is missing is downloaded).
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: qemu-system-x86 cpio flex bison bc libelf-dev libssl-dev dwarves clang lld llvm libclang-dev
          version: kernel-qemu-v1
      # The rustup toolchain (1.99.0 with rust-src, from rust-toolchain.toml), keyed on that file.
      - uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # The Rust kernel's toolchain: rustc and rust-src from rust-toolchain.toml (rustup installs it here),
      # bindgen-cli at the tested version (cached), and clang, lld and libclang for LLVM=1 and bindgen.
      - run: rustup show active-toolchain
      # The kernel build runs from the kernel's directory, where rust-toolchain.toml does not apply: pin the
      # toolchain (and so its rust-src) for every command in this job.
      - run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"
      - run: rustc -vV && rustup component list --installed | grep rust-src
      # The same pin as the Next workflow builds with (rust-toolchain.toml), in the checkout and as
      # RUSTUP_TOOLCHAIN for the kernel's directory, or the job stops.
      - name: The active rustc is the pin
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          kernel=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$kernel" = "$pin" ] && [ "$RUSTUP_TOOLCHAIN" = "$pin" ] || {
            echo "::error::rustc $here (outside the checkout $kernel, RUSTUP_TOOLCHAIN $RUSTUP_TOOLCHAIN), rust-toolchain.toml pins $pin"; exit 1; }
      # bindgen loads libclang from the clang package's directory: name it.
      - run: echo "LIBCLANG_PATH=$(dirname "$(ls /usr/lib/llvm-*/lib/libclang.so* | sort -V | tail -1)")" >> "$GITHUB_ENV"
      # bindgen-cli is cached as the binary, keyed on its version: no cargo install on a warm run.
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: ~/.cargo/bin/bindgen
          key: bindgen-cli-0.73.2-${{ runner.os }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install --locked bindgen-cli --version 0.73.2
      - run: bindgen --version
      - name: Let the job use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        id: kernel
        with:
          path: ${{ runner.temp }}/kernel-modules-off
          key: qemu-kernel-modules-off-${{ hashFiles('testing/qemu/build-kernel.sh', 'testing/qemu/kernel-modules-off.config') }}
      - run: testing/qemu/build-kernel.sh "$RUNNER_TEMP/kernel-modules-off" --modules-off
      - run: python3 scripts/check-kernel-config.py --tree "$RUNNER_TEMP/kernel-modules-off/linux-7.3.5" --config "$RUNNER_TEMP/kernel-modules-off/build/.config" --arch x86
      # Saved before the checks run, so a failing check doesn't cost the next run a kernel build.
      - uses: actions/cache/save@v4
        if: steps.kernel.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/kernel-modules-off
          key: ${{ steps.kernel.outputs.cache-primary-key }}
      - run: testing/qemu/run-builtin.sh
        env:
          KERNEL: ${{ runner.temp }}/kernel-modules-off/build/arch/x86/boot/bzImage
      # The watchdog hand-over (M36c): the same kernel, with CONFIG_I6300ESB_WDT=y. Built with gcc, as the others.
      # It builds lemnos-slot-init for musl, as run.sh's job does; rust-toolchain.toml selects the toolchain.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: testing/qemu/run-watchdog.sh
        env:
          KERNEL: ${{ runner.temp }}/kernel-modules-off/build/arch/x86/boot/bzImage
