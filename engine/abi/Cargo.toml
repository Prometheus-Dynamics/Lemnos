[package]
name = "lemnos-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The C-ABI building blocks Lemnos and its consumers share: status codes, generation-counted handles and their slab, buffer and fence descriptors, a version handshake, a panic guard for extern \"C\" entry points, and the boundary between a driver package and its host"
readme = "README.md"
keywords = ["ffi", "abi", "no-std", "hardware", "lemnos"]
categories = ["development-tools::ffi", "no-std"]

# The package boundary and its loader need unsafe code, so this crate carries its own table. Each
# block holds one unsafe operation and says why it is sound. Only `src/package` and `src/load.rs`
# have any.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
default = ["std"]
# `Slab`, the handle table.
alloc = []
# The panic guard and `Status::from_io_error`.
std = ["alloc"]
# Loading a driver package into this process (Linux): a sealed copy of the file and the dynamic
# loader. The only feature with a dependency.
load = ["std", "dep:libc"]

[dependencies]
libc = { workspace = true, optional = true }
