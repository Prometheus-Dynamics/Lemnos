[package]
name = "lemnos-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runs Lemnos drivers: board files, bind order, dispatch, containment and retries"

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../core", features = ["std"] }
lemnos-hal = { path = "../hal", features = ["std"] }
lemnos-wire = { path = "../wire" }
lemnos-identity = { path = "../identity" }
serde = { workspace = true, features = ["derive", "std"] }
toml.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
lemnos-sim = { path = "../../backends/sim" }
lemnos-measure = { path = "../measure", features = ["alloc-count"] }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-driver-orientation = { path = "../../drivers/orientation" }
lemnos-contract-orientation = { path = "../../contracts/orientation" }
lemnos-driver-hwmon-fan = { path = "../../drivers/hwmon-fan" }
lemnos-driver-thermal-zone = { path = "../../drivers/thermal-zone" }
lemnos-driver-host-clock = { path = "../../drivers/host-clock" }
lemnos-driver-fan-control = { path = "../../drivers/fan-control" }
lemnos-driver-gpio-power-switch = { path = "../../drivers/gpio-power-switch" }
lemnos-driver-bmm150 = { path = "../../drivers/bmm150" }
lemnos-driver-ina2xx = { path = "../../drivers/ina2xx" }
lemnos-driver-generic-sensor = { path = "../../drivers/generic-sensor", features = ["std"] }
lemnos-contract-power-monitor = { path = "../../contracts/power-monitor" }
lemnos-driver-hw-watchdog = { path = "../../drivers/hw-watchdog" }
lemnos-hal = { path = "../hal", features = ["std", "mock"] }
