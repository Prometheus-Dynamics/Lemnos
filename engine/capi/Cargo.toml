[package]
name = "lemnos-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lemnos client as a versioned C surface, and a Rust wrapper over that surface"

[lib]
# rlib: the Rust wrapper. staticlib and cdylib: the same surface for C.
crate-type = ["rlib", "staticlib", "cdylib"]

# The C boundary needs unsafe code, so this crate carries its own table. Each
# block holds one unsafe operation and says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
# The wrapper links the installed liblemnos_capi.so.1 instead of this crate's
# exports, which it then leaves out. LEMNOS_CAPI_LIB_DIR names its directory;
# unset, the build script builds the library itself.
shared = []

[dependencies]
lemnos-abi = { path = "../abi", features = ["std"] }
lemnos-client = { path = "../client" }
lemnos-core = { path = "../core", features = ["std"] }

[dev-dependencies]
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-host = { path = "../host" }
lemnos-sim = { path = "../../backends/sim" }
lemnosd = { path = "../../service/lemnosd" }
