[package]
name = "lemnos-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A board's identity facts (family, serial, model, running slot) read from its board file and the slot files, for lemnos-orion and the lemnos-identity tool. A library: no daemon, no device code"

[lints]
workspace = true

[[bin]]
name = "lemnos-identity"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
thiserror = { workspace = true, features = ["std"] }
