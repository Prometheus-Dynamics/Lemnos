[package]
name = "lemnos-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lemnos socket protocol: calls, values and streams, delivered without reading what they carry"

[lints]
workspace = true

# With no features: only the frame stream's ring, which needs nothing of the engine.
[features]
default = ["protocol"]
# The socket protocol: frames, calls, values, descriptions.
protocol = ["dep:lemnos-core"]

[dependencies]
lemnos-core = { path = "../core", features = ["std"], optional = true }

[dev-dependencies]
lemnos-measure = { path = "../measure", features = ["alloc-count"] }

# The protocol's own allocation test.
[[test]]
name = "alloc"
required-features = ["protocol"]
