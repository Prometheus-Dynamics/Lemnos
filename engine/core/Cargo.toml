[package]
name = "lemnos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lemnos driver model: tags, needs, resources, contracts and self-describing devices"

[lints]
workspace = true

[features]
default = []
# A host can box resources (`Held::boxed`). Without this a `Held` is always lent from a `static`
# place it goes back to when dropped, for hosts with no allocator. The type is the same either way.
alloc = ["lemnos-abi/alloc"]
std = ["alloc", "lemnos-abi/std", "lemnos-hal/std"]
# Fixed-point values as floats.
float = []

[dependencies]
lemnos-abi = { path = "../abi", default-features = false }
lemnos-hal = { path = "../hal" }
lemnos-macros = { path = "../macros" }

[dev-dependencies]
lemnos-core = { path = ".", features = ["std"] }
lemnos-hal = { path = "../hal", features = ["std", "mock"] }
