# Static musl builds of the shipped programs (lemnosd, lemnos-ctl, lemnos-orion) for OS images.
# They link with rust-lld and Rust's self-contained musl, so they need no C cross toolchain and no
# container: `rustup target add <triple>`, then `cargo build --locked -p lemnosd --profile service --target <triple>`.
# Each target's page size: the linker aligns loadable segments to it, and the binary runs only on
# kernels whose pages are no larger than that alignment (docs/building.md, "Targets").
#  - aarch64: 64 KiB (0x10000). arm64 kernels run with 4, 16 or 64 KiB pages, so the binary must
#    be aligned for 64 KiB to run on all of them.
#  - armv7: 4 KiB (0x1000). 32-bit ARM Linux has only 4 KiB pages.
#  - riscv64: 4 KiB (0x1000). Mainline RISC-V Linux has only 4 KiB pages.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "link-arg=-zmax-page-size=0x10000",
]

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "link-arg=-zmax-page-size=0x1000",
]

[target.riscv64gc-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-self-contained=yes",
  "-C", "link-arg=-zmax-page-size=0x1000",
]
