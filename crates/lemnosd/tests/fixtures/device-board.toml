# A copy of the device package's board definition, for the lemnosd --sim test
# (crates/lemnosd/tests/sim.rs). Source: Atlas Hardware Manager, rev b9ae2f5, file
# devices/raze/gaia/assets/rootfs/etc/lemnos/board.toml. Copied unchanged below this header:
# recopy from that rev rather than editing here.
# Generated by devices/tools/gen-raze.py from devices/raze/manifest.json; do not edit.
# Change the manifest and run the tool (CI runs it with --check).
#
# lemnosd's board definition (Lemnos docs/board-definition.md). The Raze package
# installs it as /etc/lemnos/board.toml; an OS replaces it with its own file there.
format = "lemnos.board"
schema_version = 1

[board]
id = "raze"
name = "Raze"
generated_by = "atlas devices/tools/gen-raze.py, raze package 1.0.7"

# 16 SK6812-EC20 LEDs on GPIO13 (ws2812-pio), grb24 on the wire;
# logical LED 0 is physical LED 5.
# count: from the manifest, unverified on hardware.
# direction: from the manifest, unverified on hardware.
[[devices]]
id = "status-ring"
driver = "ws2812"
path = "/dev/leds0"
config = { count = 16, wire = "rgb", offset = 5, direction = "cw", gpio = 13, fade_ms = 250, easing = "ease-in-out", status_effect = "breathe", gravity_device = "imu", gravity_plane = ["x", "y"], gravity_led0_deg = 112.5, default_down = 8 }

# The pwm-fan fan (hwmon name pwmfan). pwm-fan has no automatic mode,
# so no restore_mode: when lemnosd stops, the fan gets back the governor's
# cooling state and cpu-thermal re-evaluates. The duty floor (179/255) is the kernel's.
[[devices]]
id = "fan"
driver = "hwmon-fan"
match = { name = "pwmfan" }
poll_ms = 1000
writers = ["lemnosd.fan", "helios", "board-selftest", "orion:*"]

[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
match = { type = "cpu-thermal" }
poll_ms = 1000

# BMI088 accelerometer at 0x18 on the RP1 PIO bus (GPIO8 SDA, GPIO7 SCL; no kernel adapter).
# Address and chip id verified on a board by chip-id register reads.
# Raw reads (chip id) through lemnosd for: board-selftest.
# Settings: accel_rate = 100hz, gyro_rate = 100hz-32.
# BMI088 gyroscope at 0x68.
[[devices]]
id = "imu"
driver = "bmi088"
label = "IMU"
bus = "pio-i2c:sda=8,scl=7"
address = 0x18
poll_ms = 10
raw = ["board-selftest"]
config = { accel_rate = "100hz", gyro_rate = "100hz-32", gyro_address = 0x68 }

# BMM150 magnetometer at 0x10 on the hardware bus (i2c-1 on the 7.2.9 image).
# Address and chip id verified on a board by chip-id register reads.
# Bus selector from the device tree, unverified on hardware.
# Raw reads (chip id) through lemnosd for: board-selftest.
[[devices]]
id = "magnetometer"
driver = "bmm150"
bus = "i2c:of=/axi/pcie@1000120000/rp1/i2c@74000"
address = 0x10
poll_ms = 100
raw = ["board-selftest"]

# INA238 power-monitor at 0x40 on the hardware bus (i2c-1 on the 7.2.9 image).
# Address and chip id verified on a board by chip-id register reads.
# Bus selector from the device tree, unverified on hardware.
# Shunt 0.01 ohm: from the manifest, unverified against the schematic.
# Raw reads (chip id) through lemnosd for: board-selftest.
# Maximum current 16.384 A: the INA238's 163.84 mV full scale over the
# shunt (a 0.5 mA LSB), derived, not a board rating.
[[devices]]
id = "power"
driver = "ina238"
label = "Board power"
bus = "i2c:of=/axi/pcie@1000120000/rp1/i2c@74000"
address = 0x40
poll_ms = 100
raw = ["board-selftest"]
config = { shunt_micro_ohms = 10000, max_current_micro_amps = 16384000 }

# Orientation fused by lemnosd from the IMU and the magnetometer: quaternion, roll/pitch/yaw,
# gravity, linear acceleration, confidence. It runs only while a client subscribes.
# Declination is site-specific (0 here).
# Mount angles (the IMU's axes against the case): unverified on hardware.
[[devices]]
id = "orientation"
driver = "fusion"
config = { imu = "imu", mag = "magnetometer", mode = "9axis", algorithm = "mahony", kp = 1.0, ki = 0.05, mount_roll_deg = 0.0, mount_pitch_deg = 0.0, mount_yaw_deg = 0.0, declination_deg = 0.0 }

# The usb-a port's power switch (RP1 GPIO20). The firmware drives it high from
# power-on (raze-device.txt gpio=), and lemnosd requests it already on (default_on), so
# its start doesn't toggle the port. Every boot starts on (persist off: the root is
# read-only); on_exit keep leaves it as it is when lemnosd stops.
# gpio chip label: unverified on hardware.
[[devices]]
id = "usb-a-power"
driver = "gpio-power-switch"
writers = ["orion:*", "atlas"]
config = { chip = "pinctrl-rp1", line = 20, default_on = true, persist = false, on_exit = "keep" }

# The usb-c port's power switch (RP1 GPIO16). The firmware drives it high from
# power-on (raze-device.txt gpio=), and lemnosd requests it already on (default_on), so
# its start doesn't toggle the port. Every boot starts on (persist off: the root is
# read-only); on_exit keep leaves it as it is when lemnosd stops.
# gpio chip label: unverified on hardware.
[[devices]]
id = "usb-c-power"
driver = "gpio-power-switch"
writers = ["orion:*", "atlas"]
config = { chip = "pinctrl-rp1", line = 16, default_on = true, persist = false, on_exit = "keep" }
