[package]
name = "lemnosd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The board's hardware service: hosts a board definition's devices over the Lemnos compact device model and serves readings, controls and LED intents over a Unix socket"
documentation = "https://docs.rs/lemnosd"
readme = "README.md"
keywords = ["hardware", "service", "sensor", "led", "lemnos"]
categories = ["hardware-support", "os::linux-apis"]

[lints]
workspace = true

[[bin]]
name = "lemnosd"
path = "src/main.rs"

[[bin]]
name = "lemnos-ctl"
path = "src/bin/lemnos-ctl.rs"

# The Orion bridge (docs/orion.md): lemnosd's devices as Orion resources.
[[bin]]
name = "lemnos-orion"
path = "src/bin/lemnos-orion.rs"
required-features = ["orion"]

[features]
default = []
# `lemnosd::mock::MockLemnosd`: the real service over mock hardware, for
# client tests.
mock = ["lemnos-hal/mock"]
# The Orion bridge: `lemnos-orion`, a lemnosd client and an Orion provider
# over local IPC (`lemnosd::orion`). Pins Orion's main at 4fadba9; it also
# pulls in `orion-node`, which only the bridge's tests use.
orion = [
    "dep:orion-client",
    "dep:orion-control-plane",
    "dep:orion-core",
    "dep:orion-node",
    "dep:tokio",
]

[dependencies]
embedded-hal.workspace = true
lemnos-board = { workspace = true, features = ["linux"] }
lemnos-device = { workspace = true, features = ["alloc"] }
lemnos-drivers-linux.workspace = true
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-ipc.workspace = true
lemnos-light.workspace = true
lemnos-linux-sys.workspace = true
serde_json = { workspace = true, features = ["std"] }

# Orion (feature `orion`). Its crates are not published: pinned to its main.
orion-client = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "4fadba9", optional = true }
orion-control-plane = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "4fadba9", optional = true }
orion-core = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "4fadba9", optional = true }
orion-node = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "4fadba9", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
lemnosd = { path = ".", features = ["mock"] }
lemnos-bus.workspace = true
lemnos-core = { workspace = true, features = ["std"] }
lemnos-mock.workspace = true
