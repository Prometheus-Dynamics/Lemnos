[package]
name = "lemnosd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The board's hardware service: hosts a board definition's devices over the Lemnos compact device model and serves readings, controls and LED intents over a Unix socket"
documentation = "https://docs.rs/lemnosd"
readme = "README.md"
keywords = ["hardware", "service", "sensor", "led", "lemnos"]
categories = ["hardware-support", "os::linux-apis"]

[lints]
workspace = true

[[bin]]
name = "lemnosd"
path = "src/main.rs"

# The Orion bridge (docs/orion.md): lemnosd's devices as Orion resources.
[[bin]]
name = "lemnos-orion"
path = "src/bin/lemnos-orion.rs"
required-features = ["orion"]

[features]
default = []
# `lemnosd::mock::MockLemnosd`: the real service over mock hardware, for
# client tests.
mock = ["lemnos-hal/mock"]
# `lemnosd --sim`: the board's devices over simulated buses with scripted
# device models (`lemnosd::sim`, docs/system-service.md, Simulated board). Not
# in a board build.
sim = ["mock", "dep:serde"]
# The Orion bridge: `lemnos-orion`, a lemnosd client and an Orion provider
# over local IPC (`lemnosd::orion`). Pins Orion f8d767ac (control protocol 5, the orion-node that board images ship). `orion-node`
# is a dev-dependency (only the bridge's tests run an in-process node), so the
# binary never links it: its default features pull rustls and ring, which the
# musl artifact cannot build without a C cross toolchain.
orion = [
    "dep:orion-client",
    "dep:orion-control-plane",
    "dep:orion-core",
    "dep:tokio",
]

[dependencies]
embedded-hal.workspace = true
lemnos-board = { workspace = true, features = ["linux"] }
lemnos-device = { workspace = true, features = ["alloc"] }
lemnos-fusion = { path = "../lemnos-fusion" }
lemnos-drivers-linux.workspace = true
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-ipc.workspace = true
lemnos-light.workspace = true
lemnos-linux-sys.workspace = true
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"], optional = true }
toml = { workspace = true }

# Orion (feature `orion`). Its crates are not published: pinned to its main.
orion-client = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "f8d767ac", optional = true }
orion-control-plane = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "f8d767ac", optional = true }
orion-core = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "f8d767ac", optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }

[dev-dependencies]
lemnosd = { path = ".", features = ["mock"] }
# The in-process node for tests/orion_bridge.rs. IPC only: default features
# would add the HTTP/TCP/QUIC transports (rustls, ring).
orion-node = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "f8d767ac", default-features = false }
lemnos-bus.workspace = true
lemnos-core = { workspace = true, features = ["std"] }
# The integration test runs a multi-thread runtime (the binary is current-thread).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
lemnos-mock.workspace = true
