[package]
name = "lemnos-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std static device table for Lemnos: per-device status, last error and polling over lemnos-device drivers, for firmware and small Linux images"
documentation = "https://docs.rs/lemnos-lite"
readme = "README.md"
keywords = ["embedded-hal", "no-std", "sensor", "device", "lemnos"]
categories = ["embedded", "hardware-support", "no-std"]

[lints]
workspace = true

[features]
default = []

[dependencies]
embedded-hal.workspace = true
lemnos-device.workspace = true
lemnos-hal.workspace = true

[dev-dependencies]
lemnos-hal = { workspace = true, features = ["mock", "std"] }
lemnos-drivers-bmi088 = { workspace = true, default-features = false }
lemnos-drivers-ina2xx = { workspace = true, default-features = false }
lemnos-drivers-vcm.workspace = true
lemnos-linux = { workspace = true, features = ["i2c"] }
lemnos-drivers-bmm150 = { workspace = true, default-features = false }

[[example]]
name = "linux_sensors"
