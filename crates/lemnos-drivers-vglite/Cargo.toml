[package]
name = "lemnos-drivers-vglite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The K230's VGLite 2.5D GPU (resize, crop, flip, rotate, fill, blend, palette) through /dev/vg_lite: the vendor library's command streams, ported to Rust. Lines are width-1 strokes."
documentation = "https://docs.rs/lemnos-drivers-vglite"
