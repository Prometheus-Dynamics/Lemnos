[package]
name = "lemnos-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lemnos's versioned C surface over the lemnosd device client (include/lemnos.h), and a static Rust client wrapper that calls through it"
documentation = "https://docs.rs/lemnos-capi"
readme = "README.md"
keywords = ["ffi", "c-api", "hardware", "lemnos"]
categories = ["development-tools::ffi", "hardware-support"]

[lib]
# rlib: the Rust wrapper; staticlib and cdylib: the same surface for C.
crate-type = ["rlib", "staticlib", "cdylib"]

# The C boundary needs unsafe code (exported symbols, caller pointers), so
# this crate has its own lint table, as lemnos-linux-sys does: every block
# holds one unsafe operation and says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-abi = { workspace = true, features = ["std"] }
lemnos-ipc.workspace = true

[dev-dependencies]
lemnos-hal = { workspace = true, features = ["mock"] }
lemnosd = { path = "../lemnosd", features = ["mock"] }
