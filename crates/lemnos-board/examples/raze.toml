# The Raze's sensors, fan, thermal zone, status ring and USB-A power switch
# (Atlas generates this file from the board's device manifest). Addresses and
# buses verified by chip-id reads on the Raze (PhotonVision 2027 image,
# kernel 7.2.9).
format = "lemnos.board"
schema_version = 1

[board]
id = "raze"
name = "Raze"
revision = "2027"

[[devices]]
id = "imu"
label = "IMU"
driver = "bmi088"
# On the board's i2c-gpio bus (i2c-4 on the 7.2.9 image): matched by its
# device-tree compatible, since bus numbers follow probe order.
# Accelerometer 0x18 (chip id 0x1E), gyroscope 0x68 (chip id 0x0F).
bus = "i2c:compatible=i2c-gpio"
address = 0x18
poll_ms = 10
config = { gyro_address = 0x68, accel_range = "6g", accel_rate = "400hz", gyro_range = "2000dps", gyro_rate = "400hz-47" }

[[devices]]
id = "magnetometer"
driver = "bmm150"
# Chip id 0x32 once power control (0x4B) bit 0 is set, which init does.
bus = "i2c-1"
address = 0x10
poll_ms = 100
config = { preset = "regular", data_rate = "10hz" }

[[devices]]
id = "power"
label = "Board power"
driver = "ina238"
# Die id 0x2381.
bus = "i2c-1"
address = 0x40
poll_ms = 100
config = { shunt_micro_ohms = 10000, max_current_micro_amps = 5000000 }

[[devices]]
id = "fan"
driver = "hwmon-fan"
# The Linux pwm-fan driver's hwmon name is `pwmfan`. On stop it gets back the
# pwm1_enable read at bind and the governor's cooling state from before the
# first write, and the thermal zone re-evaluates (pwm-fan has no automatic
# mode, so no restore_mode here).
match = { name = "pwmfan" }
poll_ms = 1000
writers = ["lemnosd.fan", "helios"]

[[devices]]
id = "cpu-thermal"
driver = "thermal-zone"
match = { type = "cpu-thermal" }
poll_ms = 1000

# SK6812 ring on GPIO 13 (the ws2812-pio overlay), 16 LEDs, logical LED 0 at
# physical LED 5; `wire = "rgb"` ran correctly on the Raze.
[[devices]]
id = "status-ring"
driver = "ws2812"
path = "/dev/leds0"
config = { count = 16, wire = "rgb", offset = 5, direction = "cw", gpio = 13, fade_ms = 250, easing = "ease-in-out", status_effect = "breathe" }

[[devices]]
id = "usb-a-power"
driver = "gpio-output"
config = { chip = "pinctrl-rp1", line = 20, initial = true }
