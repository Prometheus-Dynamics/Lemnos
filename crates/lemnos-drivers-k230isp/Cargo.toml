[package]
name = "lemnos-drivers-k230isp"
version.workspace = true
edition.workspace = true
description = "Canaan K230D's VeriSilicon ISP8000 (the MRV-derived ISP behind /dev/vvcam-isp.0) from Rust: its register map, the statistics register reads, the register-access trait a parameter builder writes through, and, with the device feature, the vvcam-isp misc device's register ioctls on Linux."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
# Links std (for `device`); the rest of the crate is `no_std` either way.
std = []
# Read and write the vendor driver's registers through its ioctls (Linux only).
device = ["std", "dep:lemnos-linux-sys"]

[dependencies]
lemnos-linux-sys = { workspace = true, optional = true }
