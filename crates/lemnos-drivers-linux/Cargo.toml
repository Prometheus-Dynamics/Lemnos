[package]
name = "lemnos-drivers-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lemnos device-model drivers over Linux kernel interfaces: hwmon fans, thermal zones, and a generic IIO/hwmon binding for chips with mainline drivers"
documentation = "https://docs.rs/lemnos-drivers-linux"
readme = "README.md"
keywords = ["linux", "hwmon", "iio", "thermal", "sensor"]
categories = ["hardware-support", "os::linux-apis"]

[lints]
workspace = true

[dependencies]
lemnos-device.workspace = true
lemnos-drivers-ws2812.workspace = true
lemnos-hal = { workspace = true, features = ["std"] }
embedded-hal.workspace = true

[dev-dependencies]
lemnos-drivers-bmi088 = { workspace = true, default-features = false }
lemnos-drivers-ina2xx = { workspace = true, default-features = false }
