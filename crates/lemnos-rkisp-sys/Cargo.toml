[package]
name = "lemnos-rkisp-sys"
version.workspace = true
edition.workspace = true
description = "The Rockchip ISP21, ISP30 and ISP32 (RV1106, RK3562) uAPI layouts of the vendor kernel's rkisp driver: the -sys crate of lemnos-drivers-rkisp, no_std, generated by bindgen from the kernel headers."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

# The one Lemnos crate with unsafe code besides lemnos-linux-sys and lemnos-capi: the bindgen
# bitfield accessors and the bitfield unit's Pod impls. Its lint table is lemnos-linux-sys's.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
