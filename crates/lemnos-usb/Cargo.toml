[package]
name = "lemnos-usb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One USB layer for Lemnos: listing, hotplug, descriptors, control, bulk, interrupt and isochronous transfers over Linux usbdevfs, Windows WinUSB and macOS IOKit"
documentation = "https://docs.rs/lemnos-usb"
readme = "README.md"
exclude = ["src/tests.rs", "src/tests/**", "src/**/tests.rs", "tests/**"]
keywords = ["usb", "hardware", "linux", "windows", "macos"]
categories = ["hardware-support", "os"]

[lints]
workspace = true

[dependencies]
futures-core.workspace = true
libc.workspace = true
nusb.workspace = true

# usbdevfs lives in lemnos-linux-sys, the workspace's one crate with `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { workspace = true, default-features = false }
