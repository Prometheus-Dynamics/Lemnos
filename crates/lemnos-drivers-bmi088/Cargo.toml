[package]
name = "lemnos-drivers-bmi088"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "no_std Bosch BMI088 IMU (accelerometer + gyroscope) driver for Lemnos over embedded-hal I2C"
documentation = "https://docs.rs/lemnos-drivers-bmi088"
readme = "README.md"
keywords = ["embedded-hal", "no-std", "bmi088", "imu", "bosch"]
categories = ["embedded", "hardware-support", "no-std"]

[lints]
workspace = true

[features]
default = ["float"]
# SI-unit `f32` readings. Off: integer readings only (`read_fixed`), which keeps
# software float routines out of images for MCUs without an FPU.
float = []

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
lemnos-hal.workspace = true

[dev-dependencies]
lemnos-hal = { workspace = true, features = ["mock"] }
