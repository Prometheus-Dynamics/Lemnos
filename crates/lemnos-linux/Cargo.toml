[package]
name = "lemnos-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux discovery, transports, hotplug, and embedded-hal implementations for Lemnos, in pure Rust"
documentation = "https://docs.rs/lemnos-linux"
readme = "README.md"
exclude = ["src/tests.rs", "src/tests/**", "src/**/tests.rs", "tests/**"]
keywords = ["linux", "gpio", "i2c", "spi", "usb"]
categories = ["embedded", "hardware-support"]

[lints]
workspace = true

[features]
default = []
# The RP1 PIO I2C bus (`PioI2cBus`, the `pio-i2c:` selectors).
rp1 = ["lemnos-core/rp1", "lemnos-linux-sys/rp1"]
full = ["gpio", "pwm", "i2c", "spi", "uart", "usb", "gpio-cdev", "hotplug", "dma", "v4l2-m2m"]
gpio = []
pwm = []
i2c = []
spi = []
uart = ["dep:serialport"]
usb = ["dep:lemnos-usb"]
hotplug = []
gpio-sysfs = []
# DMA buffers: dma-heap allocation, dma-buf sync, mappings and sync-file fences (`dma`).
dma = []
# V4L2 memory-to-memory sessions (`v4l2::m2m`).
v4l2-m2m = []
# The RP1 DesignWare AXI DMAC as a transfer engine (`rp1_dma`), through
# `/dev/mem` (root only). Off by default; untested on board for transfers.
rp1-dma = ["lemnos-linux-sys/rp1-dma"]
# GPIO character device, uAPI v2 (Linux 5.10+).
gpio-cdev = ["gpio"]
tracing = ["dep:tracing", "lemnos-uevent/tracing"]
# Reactor-driven async hotplug watching; takes effect together with `hotplug`.
tokio = ["dep:tokio", "lemnos-uevent/tokio"]

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
lemnos-bus.workspace = true
lemnos-core = { workspace = true, features = ["std"] }
lemnos-discovery.workspace = true
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-linux-sys = { workspace = true, default-features = false }
lemnos-uevent.workspace = true
lemnos-usb = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net"] }
tracing = { workspace = true, optional = true }

[[example]]
name = "v3d_pending_fence"
required-features = ["dma"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
