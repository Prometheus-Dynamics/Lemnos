[package]
name = "lemnos-drivers-rga"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rockchip RGA 2D engine (scale, crop, pixel-format conversion, flip and turn between dmabufs) through the V4L2 mem2mem driver, with the route table that sends the rest to the vendor's multi-RGA node or to the CPU."
documentation = "https://docs.rs/lemnos-drivers-rga"
readme = "README.md"
keywords = ["rockchip", "rga", "v4l2", "dmabuf", "2d"]
categories = ["hardware-support", "multimedia::images"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux = { workspace = true, features = ["v4l2-m2m"] }
lemnos-linux-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-linux = { workspace = true, features = ["v4l2-m2m", "dma"] }
