[package]
name = "lemnos-driver-k230-usbboot-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The K230 USB-boot stage's entry and its register access: the only unsafe code of that stage. Arms the watchdog before anything else. Never linked into lemnosd"

# One of the crates allowed `unsafe` (AGENTS.md): every block carries a `SAFETY` comment and holds
# one operation, and no logic lives here. The stage's logic is in lemnos-k230-usbboot-stage.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-k230-usbboot-stage = { path = "../../testing/crates/k230-usbboot-stage" }
