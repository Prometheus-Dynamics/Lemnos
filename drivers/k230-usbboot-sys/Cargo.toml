[package]
name = "lemnos-driver-k230-usbboot-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The K230 USB-boot stage's entry and its register access: the only unsafe code of that stage. Arms the watchdog before anything else. Never linked into lemnosd"

# One of the crates allowed `unsafe` (AGENTS.md): every block carries a `SAFETY` comment and holds
# one operation, and no logic lives here. The stage's logic is in lemnos-k230-usbboot-stage.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-k230-usbboot-stage = { path = "../k230-usbboot-stage" }
# The B2 check build's session and frame sizes (the shared stage rules and the wire).
lemnos-flash-stage = { path = "../flash-stage" }
lemnos-flash-wire = { path = "../flash-wire" }

[features]
# The B2 check build: the image runs only the check (fl1::check), and the SD host code is not reached, so
# the linker drops it. drivers/k230-usbboot-image/check.sh --b2 builds it and checks the image for it.
b2 = ["ep0-trace"]
# The B2 scratch build: the image runs only the scratch run (crate::scratch: the B2 USB device path over the card,
# reachable only inside the scratch range). The card image's piece, report and stage runs are not reached, so the
# linker drops them. drivers/k230-usbboot-image/check.sh --b2-card builds it and checks the image for it. It keeps
# the endpoint 0 trace, so its USB driver is the code the check build ran on the board.
b2-card = ["ep0-trace"]
# The endpoint 0 trace (dwc2::Trace): kept by the B2 builds and the PC rehearsal, not by the card image.
ep0-trace = []
