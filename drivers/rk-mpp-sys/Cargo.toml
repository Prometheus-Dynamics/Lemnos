[package]
name = "lemnos-driver-rk-mpp-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The rk-mpp driver's unsafe layer: a session on the vendor kernel's /dev/mpp_service that issues the driver's message chains from memory it owns for as long as the kernel may use it"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Linux only. The driver's trait, messages and uAPI layouts come from `lemnos-driver-rk-mpp`, which
# holds no `unsafe` and does not depend on this crate.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-driver-rk-mpp = { path = "../rk-mpp" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-driver-rk-mpp = { path = "../rk-mpp", features = ["played"] }
