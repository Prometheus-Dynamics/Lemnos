[package]
name = "lemnos-driver-orion-precheck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-contract-security-precondition = { path = "../../contracts/security-precondition" }
# Orion's client, pinned to the revision the bridge uses. The precheck is Orion's `security_precheck`.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "927f704a40d008d4702d478974fcbf4ef89f747c", default-features = false }

[dev-dependencies]
lemnos-socket-dir = { path = "../../testing/crates/socket-dir" }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
orion-node-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "927f704a40d008d4702d478974fcbf4ef89f747c", default-features = false }
orion-config = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "927f704a40d008d4702d478974fcbf4ef89f747c" }
orion-stubs = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "927f704a40d008d4702d478974fcbf4ef89f747c" }
orion-comm-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "927f704a40d008d4702d478974fcbf4ef89f747c" }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }

[package.metadata.lemnos]
driver = "OrionPrecheck"
# Off in a consumer that embeds lemnosd without it (default-features = false on lemnosd).
feature = "orion-precheck"
feature_requires = ["lemnos-shipped-features/orion"]
