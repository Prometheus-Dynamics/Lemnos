[package]
name = "lemnos-driver-a733-di-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The deinterlacer's character device on the vendor kernel: its requests and structures, a job built only from frames checked against the dma-buf each sits in, and a node that issues the requests and never maps the device. The only place the a733-di driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true

[dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
