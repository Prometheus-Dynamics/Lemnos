[package]
name = "lemnos-driver-rockchip-maskrom-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bench tooling for the Rockchip maskrom flasher: the MMIO primitives and the 471 watchdog stub, the only unsafe code of that flasher. Never linked into lemnosd"

# One of the crates allowed `unsafe` (AGENTS.md): every block carries a `SAFETY` comment and holds
# one operation, and no logic lives here. Same lint table as the other -sys crates.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
# The 472 loader's code: the stage crate forbids unsafe, this crate holds only the entry glue.
lemnos-rockchip-maskrom-stage = { path = "../rockchip-maskrom-stage" }
lemnos-flash-wire = { path = "../flash-wire" }
lemnos-flash-stage = { path = "../flash-stage" }
