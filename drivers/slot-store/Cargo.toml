[package]
name = "lemnos-slot-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The board's slot files: the layout, state, per-slot records and the schema 3 manifest, shared by the system-slots driver and lemnos-slot-init"

[lints]
workspace = true

# Plain std: lemnos-slot-init links it into a static initramfs program. `linux` adds the UBI
# ioctls (`ubi::System`) through lemnos-linux-sys; `fake` adds `ubi::Fake` for other crates' tests.
[features]
linux = ["dep:lemnos-linux-sys"]
fake = []

# The key id (SHA-256 of a public key) and nothing else of the signing code: verification is the
# drivers' own (they hold ed25519), so slot-init, which never verifies, does not link it.
[dependencies]
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys", optional = true }
