[package]
name = "lemnos-driver-rknpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Rockchip NPU behind the vendor kernel's DRM node, serving npu/1: the caller's program carried as bytes, each program in an IOMMU domain of its own holding only its buffers, every task field the kernel takes checked. No vendor library"

[lints]
workspace = true

# No `unsafe` here: every system call goes through lemnos-driver-rknpu-sys, which holds the
# `unsafe`. This crate's `Device` and `Session` traits are implemented on its node and session.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-driver-rknpu-sys = { path = "../rknpu-sys" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-npu = { path = "../../contracts/npu" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }

[package.metadata.lemnos]
driver = "Rknpu"
