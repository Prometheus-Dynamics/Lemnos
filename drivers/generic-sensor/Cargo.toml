[package]
name = "lemnos-driver-generic-sensor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# The `description` setting is a path to the description file, read at bind,
# instead of the text itself.
std = []

[dependencies]
lemnos-core = { path = "../../engine/core" }
lemnos-hal = { path = "../../engine/hal" }
lemnos-contract-magnetometer = { path = "../../contracts/magnetometer" }
lemnos-contract-accelerometer = { path = "../../contracts/accelerometer" }
lemnos-contract-gyroscope = { path = "../../contracts/gyroscope" }
lemnos-contract-temperature = { path = "../../contracts/temperature" }
lemnos-contract-power-monitor = { path = "../../contracts/power-monitor" }

[dev-dependencies]
lemnos-sim = { path = "../../backends/sim" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-driver-bmm150 = { path = "../bmm150" }

[package.metadata.lemnos]
driver = [
    "GenericMagnetometer",
    "GenericAccelerometer",
    "GenericGyroscope",
    "GenericTemperature",
    "GenericPowerMonitor",
]
