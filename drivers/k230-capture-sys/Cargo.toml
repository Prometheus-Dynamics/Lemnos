[package]
name = "lemnos-driver-k230-capture-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The ISP8000 frame path behind the vendor vvcam-isp device and the CSI behind vvcam-mipi: frame-path registers checked against a table that holds no address, and the memory interface's address registers written only from DMA memory this crate holds. The only place the k230-capture driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-hal = { path = "../../engine/hal" }
lemnos-driver-k230isp-sys = { path = "../k230isp-sys" }

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
libc.workspace = true

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
