[package]
name = "lemnos-driver-rga-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The RGA driver's unsafe layer: the vendor kernel's multi-RGA request (dma-bufs only, every extent checked) and the RISC-V vector rows of the CPU route"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
