[package]
name = "lemnos-driver-sunxi-vin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-camera-receiver = { path = "../../contracts/camera-receiver" }
lemnos-v4l2 = { path = "../../backends/v4l2" }
lemnos-driver-v4l2-capture = { path = "../v4l2-capture" }

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
# Only for its test allocator, which makes each stream buffer a sealed memfd with a handle.
lemnos-driver-codec-jobs = { path = "../codec-jobs", features = ["testing"] }

[package.metadata.lemnos]
driver = "SunxiVin"
