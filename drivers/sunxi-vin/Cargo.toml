[package]
name = "lemnos-driver-sunxi-vin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-camera-receiver = { path = "../../contracts/camera-receiver" }
