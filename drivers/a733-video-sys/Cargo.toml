[package]
name = "lemnos-driver-a733-video-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The second video engine on the vendor kernel's character device (the requests that take a value or one plain structure, and a read-only mapping of exactly the register window). With lemnos-driver-regjob-sys, the only unsafe code the a733-video driver touches"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
