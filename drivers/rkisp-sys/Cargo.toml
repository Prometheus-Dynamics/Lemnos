[package]
name = "lemnos-driver-rkisp-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The vendor rkisp driver's ISP21, ISP30 and ISP35 parameter and statistics layouts, generated by bindgen and checked against the C compiler: the only place the rkisp driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys. Its only
# unsafe code is bindgen's bitfield accessors in the generated ISP35 module, whose header says so.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
