[package]
name = "lemnos-driver-g2d"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The G2D 2D engine (fill, scale, format conversion, quarter turns and flips, blending between dma-bufs) through the BSP kernel's /dev/g2d, reopened after a failure. No vendor library"

[lints]
workspace = true

# Linux only: every system call goes through lemnos-driver-g2d-sys, which holds the `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-driver-g2d-sys = { path = "../g2d-sys" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-image-convert = { path = "../../contracts/image-convert" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
