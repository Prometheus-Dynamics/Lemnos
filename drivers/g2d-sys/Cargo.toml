[package]
name = "lemnos-driver-g2d-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The G2D 2D engine's /dev/g2d requests, built only from checked dma-buf surfaces: the only place the g2d driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
