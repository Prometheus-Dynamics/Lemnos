[package]
name = "lemnos-driver-usb-gadget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["alloc"]
# The memory for one endpoint transfer is taken from the allocator, 64 KiB of it, and only
# when the board gives the device a data stream. Without this it is 1 KiB inside the driver.
alloc = ["lemnos-core/alloc"]
# The `interfaces` setting is a path to a file holding the text, read at bind, instead of the
# text itself.
std = ["alloc"]

[dependencies]
lemnos-core = { path = "../../engine/core" }
lemnos-hal = { path = "../../engine/hal" }
lemnos-contract-usb-function = { path = "../../contracts/usb-function" }
# The NCM addresses a board identity gives (`derive`): SHA-256, no_std, as the tree already uses it.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["mock"] }
lemnos-linux = { path = "../../backends/linux" }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }

[package.metadata.lemnos]
driver = "UsbGadget"
