[package]
name = "lemnos-driver-m2m-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Stateless video decode through the kernel's V4L2 memory-to-memory and request interfaces: a session over one M2M node, media requests, and a stateless block that carries the caller's controls and buffers as bytes. No vendor library"

[lints]
workspace = true

[features]
# The played-back node of this crate's tests, for the tests of the crates that drive it.
mock = []

[dependencies]
# Linux only: every system call goes through lemnos-linux-sys, the one crate allowed `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-codec-block = { path = "../../contracts/codec-block" }
lemnos-driver-codec-jobs = { path = "../codec-jobs" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-driver-codec-jobs = { path = "../codec-jobs", features = ["testing"] }

[package.metadata.lemnos]
driver = "M2mCodec"
