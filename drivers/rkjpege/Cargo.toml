[package]
name = "lemnos-driver-rkjpege"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Rockchip JPEG encoder's register file (the VPU720 block's 79 words, pinned to the vendor header by gcc and clang), and a builder that makes rk-mpp's Job for it: typed fields, address registers checked against the caller's buffers and their sizes, and the picture's planes checked against their strides. No vendor library; no JPEG policy; the caller supplies every value"

[lints]
workspace = true

# Linux only, like the rk-mpp crates the jobs are given to: the job type is `lemnos-driver-rk-mpp`'s.
# Without the engine (`device`, off here) the crate is the layouts and the builder alone.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-driver-rk-mpp = { path = "../rk-mpp", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-driver-rk-mpp = { path = "../rk-mpp", features = ["played", "device"] }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
