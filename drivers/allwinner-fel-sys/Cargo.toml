[package]
name = "lemnos-driver-allwinner-fel-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Allwinner FEL thunks: the on-chip routines the boot ROM's FEL loop runs, as naked assembly for armv7a-none-eabi and aarch64-unknown-none. The only unsafe code of the FEL blob; the layout and the writer are in lemnos-allwinner-fel-blob"

# One of the crates allowed `unsafe` (AGENTS.md): each block holds one operation and carries a SAFETY
# comment. Same lint table as the other -sys crates.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# The thunk itself has no dependencies: it is assembled from its own source. The host-side test runs the
# blob's pinned bytes under user-mode emulation, so it needs the blob crate and the C library's mmap and fork.
[dependencies]

[dev-dependencies]
lemnos-allwinner-fel-blob = { path = "../allwinner-fel-blob" }
libc = { workspace = true }
