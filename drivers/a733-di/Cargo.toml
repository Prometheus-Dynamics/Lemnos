[package]
name = "lemnos-driver-a733-di"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The A733 deinterlacer through the vendor kernel's /dev/deinterlace: weave, bob, motion-adaptive and temporal noise reduction between dma-bufs, every request built from frames checked against the buffers the caller holds. No vendor library"

[lints]
workspace = true

# Linux only: request encodings and a dma-buf's size, from the crate allowed `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-driver-a733-di-sys = { path = "../a733-di-sys" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-codec-block = { path = "../../contracts/codec-block" }
lemnos-driver-codec-jobs = { path = "../codec-jobs" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-driver-codec-jobs = { path = "../codec-jobs", features = ["testing"] }

[package.metadata.lemnos]
driver = "A733Di"
