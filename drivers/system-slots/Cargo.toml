[package]
name = "lemnos-driver-system-slots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-contract-security-precondition = { path = "../../contracts/security-precondition" }
lemnos-contract-system-slots = { path = "../../contracts/system-slots" }
lemnos-contract-system-reboot = { path = "../../contracts/system-reboot" }
lemnos-contract-indicator = { path = "../../contracts/indicator" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
# The slot files, shared with lemnos-slot-init.
lemnos-slot-store = { path = "../slot-store", features = ["linux"] }
# The firmware mailbox that clears the boot count; the only unsafe code it reaches is there.
lemnos-driver-rpi-firmware-sys = { path = "../rpi-firmware-sys" }
# Both already in the tree through lemnos-package: the signature check and the hashes.
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
libc.workspace = true

[dev-dependencies]
# The command a builder runs: a test installs the file it writes (a dev-dependency cycle: ctl runs the driver).
lemnos-ctl = { path = "../../service/ctl" }
lemnos-slot-store = { path = "../slot-store", features = ["linux", "fake", "testing"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
ed25519-dalek = { version = "2.2", default-features = false }

[package.metadata.lemnos]
driver = ["SystemSlots", "SystemReboot"]
