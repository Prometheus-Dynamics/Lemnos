[package]
name = "lemnos-driver-k230isp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The ISP8000 behind the vendor vvcam-isp device as camera.isp/1: register writes in, checked against the registers that carry no address, and the statistics registers out per frame. Carried, never read"

[lints]
workspace = true

# With no features: the library half, used without the daemon. The configuration layout and its
# check, the statistics layout and its decoder, and the register map; no driver, no engine.
[features]
default = ["device"]
# The `camera.isp/1` driver.
device = ["dep:lemnos-core", "dep:lemnos-hal", "dep:lemnos-contract-camera-isp"]

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"], optional = true }
lemnos-hal = { path = "../../engine/hal", features = ["std"], optional = true }
lemnos-contract-camera-isp = { path = "../../contracts/camera-isp", optional = true }
lemnos-driver-k230isp-sys = { path = "../k230isp-sys" }

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }

[package.metadata.lemnos]
driver = "K230Isp"
