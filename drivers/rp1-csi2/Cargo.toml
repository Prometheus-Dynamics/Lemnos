[package]
name = "lemnos-driver-rp1-csi2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-contract-camera-receiver = { path = "../../contracts/camera-receiver" }
lemnos-contract-camera-isp = { path = "../../contracts/camera-isp" }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-driver-rp1-csi2-sys = { path = "../rp1-csi2-sys" }

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }

[package.metadata.lemnos]
driver = "Rp1Csi2"
