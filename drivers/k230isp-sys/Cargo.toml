[package]
name = "lemnos-driver-k230isp-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The vendor vvcam-isp misc device's register and event requests, with every register access bounded to the ISP's window and to the registers that carry no address: the only place the k230isp driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
