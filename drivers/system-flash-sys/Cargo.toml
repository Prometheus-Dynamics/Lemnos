[package]
name = "lemnos-driver-system-flash-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The partition re-read request on a block device: the only place the system-flash driver touches unsafe code"

# One of the crates allowed `unsafe`, with the same lint table as hw-watchdog-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
