[package]
name = "lemnos-driver-rknpu-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The rknpu driver's unsafe layer: a session on the vendor kernel's NPU DRM node that issues the driver's checked requests and maps only the objects it made"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Linux only. The traits, requests and layouts come from `lemnos-driver-rknpu`, which holds no
# `unsafe` and does not depend on this crate.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-driver-rknpu = { path = "../rknpu" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
