[package]
name = "lemnos-driver-rknpu-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The rknpu driver's kernel interface: the NPU DRM node's layouts, the checked requests, and a session that issues only those and maps only the objects it made"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Linux only. The kernel's layouts and the checked requests are here; `lemnos-driver-rknpu`, which
# holds no `unsafe`, depends on this crate and implements its traits on these types.
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
