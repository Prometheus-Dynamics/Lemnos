[package]
name = "lemnos-driver-rkisp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The vendor rkisp ISP (ISP21, ISP30, ISP35) as camera.isp/1, through the vendor kernel driver's stock nodes: parameters in, statistics and images out, carried and never read."

[lints]
workspace = true

# With no features: the library half, used without the daemon. The parameter and statistics
# layouts, the generation table and the ISP path in the media graph; no driver, no engine.
[features]
default = ["device"]
# The `camera.isp/1` driver.
device = ["dep:lemnos-core", "dep:lemnos-hal", "dep:lemnos-contract-camera-isp"]

[dependencies]
lemnos-abi = { path = "../../engine/abi", default-features = false }
lemnos-core = { path = "../../engine/core", features = ["std"], optional = true }
lemnos-hal = { path = "../../engine/hal", features = ["std"], optional = true }
lemnos-contract-camera-isp = { path = "../../contracts/camera-isp", optional = true }
lemnos-driver-rkisp-sys = { path = "../rkisp-sys" }
lemnos-v4l2 = { path = "../../backends/v4l2" }

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }

[package.metadata.lemnos]
driver = "Rkisp"
