[package]
name = "lemnos-driver-rkisp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The vendor rkisp ISP (ISP21, ISP30, ISP35) as camera.isp/1, through the vendor kernel driver's stock nodes: parameters in, statistics and images out, carried and never read."

[lints]
workspace = true

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-contract-camera-isp = { path = "../../contracts/camera-isp" }
lemnos-driver-rkisp-sys = { path = "../rkisp-sys" }
lemnos-v4l2 = { path = "../../backends/v4l2" }

[dev-dependencies]
lemnos-hal = { path = "../../engine/hal", features = ["std", "mock"] }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }

[package.metadata.lemnos]
driver = "Rkisp"
