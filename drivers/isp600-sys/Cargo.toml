[package]
name = "lemnos-driver-isp600-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The ISP600 driver's unsafe layer: the vendor kernel's ISP and statistics subdevice requests whose arguments carry a pointer the kernel follows, issued only on memory of the exact size the kernel copies"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# The layouts and request numbers build anywhere; the calls are Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
