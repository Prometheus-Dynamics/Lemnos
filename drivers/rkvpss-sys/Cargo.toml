[package]
name = "lemnos-driver-rkvpss-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The rkvpss offline scaler's kernel node, safely wrapped: its uAPI, the checks that keep a job inside the caller's dma-bufs, and the only unsafe code the scaler driver touches"

# One of the crates allowed `unsafe`, with the same lint table as lemnos-linux-sys: every block
# carries a `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
lemnos-linux-sys = { path = "../../backends/linux-sys" }
libc.workspace = true
