[package]
name = "lemnos-slot-init"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The initramfs program that boots a board's slot: finds the data partition, opens the slot's image through dm-verity and switches into it, and falls back when it can't"

[lints]
workspace = true

[[bin]]
name = "lemnos-slot-init"
path = "src/main.rs"

# Lean on purpose: a static initramfs program. No serde, no async; the system calls are
# lemnos-linux-sys's safe wrappers.
[dependencies]
# The shipped programs' feature baseline (service/shipped-features): the same features whichever programs are built together.
lemnos-shipped-features = { path = "../shipped-features", features = ["orion"] }
lemnos-slot-store = { path = "../../drivers/slot-store", features = ["linux"] }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-driver-rpi-firmware-sys = { path = "../../drivers/rpi-firmware-sys" }
lemnos-driver-hw-watchdog-sys = { path = "../../drivers/hw-watchdog-sys" }
# The serial settings the command line names, and their one reader (the driver reads them the same way).
lemnos-identity = { path = "../../engine/identity" }

[dev-dependencies]
lemnos-slot-store = { path = "../../drivers/slot-store", features = ["linux", "fake"] }
# The test reads the kernel requirements file; a dev-dependency, so the initramfs binary has no toml.
toml.workspace = true
# The end-to-end tests drive the daemon's own install path (`BootRecord` on the raw boot partition)
# against slot-init's boot check; test code only, never in the initramfs program.
lemnos-driver-system-slots = { path = "../../drivers/system-slots" }
