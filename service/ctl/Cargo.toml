[package]
name = "lemnos-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Inspect and drive any Lemnos device from the command line"

[lints]
workspace = true

[[bin]]
name = "lemnos-ctl"
path = "src/main.rs"

[dependencies]
lemnos-client = { path = "../../engine/client" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
# For `validate`: the board file parser, the same one lemnosd reads it with.
lemnos-host = { path = "../../engine/host" }
# For `tree` and the live check of `validate`: the overlay generator and the SoC map.
lemnos-devtree = { path = "../devtree" }
# For `security render` and `tree --boot-dir`: the switch record and its view, the Pi firmware's fixed files and the slot records.
lemnos-slot-store = { path = "../../drivers/slot-store" }
lemnos-linux = { path = "../../backends/linux" }
lemnos-wire = { path = "../../engine/wire" }
# For the slot layout contract (`contracts/slot-layout.toml`), read by `tree --boot-dir`.
toml = { workspace = true }
# For `tree`: the built-in drivers' manifests, which say what each device needs.
lemnosd = { path = "../lemnosd" }

[dev-dependencies]
syn.workspace = true
lemnos-driver-named-files = { path = "../../drivers/named-files" }
lemnos-driver-system-slots = { path = "../../drivers/system-slots" }
lemnos-contract-accelerometer = { path = "../../contracts/accelerometer" }
lemnos-contract-camera-frames = { path = "../../contracts/camera-frames" }
lemnos-contract-camera-isp = { path = "../../contracts/camera-isp" }
lemnos-contract-camera-receiver = { path = "../../contracts/camera-receiver" }
lemnos-contract-camera-sensor = { path = "../../contracts/camera-sensor" }
lemnos-contract-codec-block = { path = "../../contracts/codec-block" }
lemnos-contract-fan-control = { path = "../../contracts/fan-control" }
lemnos-contract-fan = { path = "../../contracts/fan" }
lemnos-contract-gpu-lease = { path = "../../contracts/gpu-lease" }
lemnos-contract-gyroscope = { path = "../../contracts/gyroscope" }
lemnos-contract-image-blend = { path = "../../contracts/image-blend" }
lemnos-contract-image-convert = { path = "../../contracts/image-convert" }
lemnos-contract-image-scaler = { path = "../../contracts/image-scaler" }
lemnos-contract-isp-isp600 = { path = "../../contracts/isp-isp600" }
lemnos-contract-isp-pisp = { path = "../../contracts/isp-pisp" }
lemnos-contract-lens = { path = "../../contracts/lens" }
lemnos-contract-light = { path = "../../contracts/light" }
lemnos-contract-magnetometer = { path = "../../contracts/magnetometer" }
lemnos-contract-npu = { path = "../../contracts/npu" }
lemnos-contract-orientation = { path = "../../contracts/orientation" }
lemnos-contract-pixels = { path = "../../contracts/pixels" }
lemnos-contract-power-monitor = { path = "../../contracts/power-monitor" }
lemnos-contract-power-switch = { path = "../../contracts/power-switch" }
lemnos-contract-raw-bus = { path = "../../contracts/raw-bus" }
lemnos-contract-security = { path = "../../contracts/security" }
lemnos-contract-security-precondition = { path = "../../contracts/security-precondition" }
lemnos-contract-system-identity = { path = "../../contracts/system-identity" }
lemnos-contract-system-reboot = { path = "../../contracts/system-reboot" }
lemnos-contract-system-slots = { path = "../../contracts/system-slots" }
lemnos-contract-temperature = { path = "../../contracts/temperature" }
lemnos-contract-usb-function = { path = "../../contracts/usb-function" }
lemnosd = { path = "../lemnosd" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-sim-walk = { path = "../../testing/crates/sim-walk" }
