[package]
name = "lemnos-good-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The good-boot deadline: waits for lemnosd to be ready and the booted marker to be set, or fails so the board restarts"
publish = false

[lints]
workspace = true

[[bin]]
name = "lemnos-good-boot"
path = "src/main.rs"

[dependencies]
# The booted marker's path and the slot id rule, and the deadline's rule: the same code slot-init and the driver use.
lemnos-slot-store = { path = "../../drivers/slot-store" }

[dev-dependencies]
lemnos-scratch = { path = "../../testing/crates/scratch" }
