[package]
name = "lemnosd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lemnos service: one process owns the hardware and serves every client"

[lints]
workspace = true

[features]
default = ["orion-precheck"]
# generated: begin features
orion-precheck = ["dep:lemnos-driver-orion-precheck", "lemnos-shipped-features/orion"]
# generated: end features
# Serves the fake devices from `testing/crates/fake-devices`.
fake-devices = ["dep:lemnos-fake-devices"]
# The QEMU route-A check's boot-chain seam: `LEMNOSD_TEST_BOOT_ROOTS=CHOSEN:SYS:DEV` stands in the
# device tree, sysfs and /dev the slot drivers read (an x86 guest has no device tree). Never in a
# shipped binary: testing/qemu/run.sh builds it apart, as /lemnosd-route-a.
testing-boot-roots = ["dep:lemnos-slot-store", "lemnos-slot-store/testing"]

[dependencies]
# The shipped programs' feature baseline (service/shipped-features): the same features whichever programs are built together.
lemnos-shipped-features = { path = "../shipped-features" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-host = { path = "../../engine/host" }
lemnos-devtree = { path = "../devtree" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-client = { path = "../../engine/client" }
lemnos-package = { path = "../../engine/package" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-linux = { path = "../../backends/linux" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices", optional = true }
lemnos-slot-store = { path = "../../drivers/slot-store", optional = true }
toml.workspace = true
# generated: begin drivers
lemnos-driver-a733-di = { path = "../../drivers/a733-di" }
lemnos-driver-a733-video = { path = "../../drivers/a733-video" }
lemnos-driver-bmi088 = { path = "../../drivers/bmi088" }
lemnos-driver-bmm150 = { path = "../../drivers/bmm150" }
lemnos-driver-board-self-test = { path = "../../drivers/board-self-test" }
lemnos-driver-coral-loader = { path = "../../drivers/coral-loader" }
lemnos-driver-fan-control = { path = "../../drivers/fan-control" }
lemnos-driver-g2d = { path = "../../drivers/g2d" }
lemnos-driver-generic-sensor = { path = "../../drivers/generic-sensor" }
lemnos-driver-gpio-power-switch = { path = "../../drivers/gpio-power-switch" }
lemnos-driver-gpu-lease = { path = "../../drivers/gpu-lease" }
lemnos-driver-host-clock = { path = "../../drivers/host-clock" }
lemnos-driver-hw-watchdog = { path = "../../drivers/hw-watchdog" }
lemnos-driver-hwmon-fan = { path = "../../drivers/hwmon-fan" }
lemnos-driver-ina2xx = { path = "../../drivers/ina2xx" }
lemnos-driver-indicator = { path = "../../drivers/indicator" }
lemnos-driver-isp600 = { path = "../../drivers/isp600" }
lemnos-driver-k230-capture = { path = "../../drivers/k230-capture" }
lemnos-driver-k230-vpu = { path = "../../drivers/k230-vpu" }
lemnos-driver-k230isp = { path = "../../drivers/k230isp" }
lemnos-driver-m2m-decode = { path = "../../drivers/m2m-decode" }
lemnos-driver-named-files = { path = "../../drivers/named-files" }
lemnos-driver-nonai2d = { path = "../../drivers/nonai2d" }
lemnos-driver-orientation = { path = "../../drivers/orientation" }
lemnos-driver-orion-precheck = { path = "../../drivers/orion-precheck", optional = true }
lemnos-driver-ov9782 = { path = "../../drivers/ov9782" }
lemnos-driver-pisp = { path = "../../drivers/pisp" }
lemnos-driver-pwm-channel-fan = { path = "../../drivers/pwm-channel-fan" }
lemnos-driver-raw-bus = { path = "../../drivers/raw-bus" }
lemnos-driver-rga = { path = "../../drivers/rga" }
lemnos-driver-rk-iep = { path = "../../drivers/rk-iep" }
lemnos-driver-rk-mpp-codec = { path = "../../drivers/rk-mpp-codec" }
lemnos-driver-rkcif = { path = "../../drivers/rkcif" }
lemnos-driver-rkisp = { path = "../../drivers/rkisp" }
lemnos-driver-rknpu = { path = "../../drivers/rknpu" }
lemnos-driver-rkvpss = { path = "../../drivers/rkvpss" }
lemnos-driver-rp1-csi2 = { path = "../../drivers/rp1-csi2" }
lemnos-driver-status-light = { path = "../../drivers/status-light" }
lemnos-driver-sunxi-vin = { path = "../../drivers/sunxi-vin" }
lemnos-driver-system-flash = { path = "../../drivers/system-flash" }
lemnos-driver-system-identity = { path = "../../drivers/system-identity" }
lemnos-driver-system-security = { path = "../../drivers/system-security" }
lemnos-driver-system-slots = { path = "../../drivers/system-slots" }
lemnos-driver-thermal-zone = { path = "../../drivers/thermal-zone" }
lemnos-driver-usb-gadget = { path = "../../drivers/usb-gadget" }
lemnos-driver-uvc = { path = "../../drivers/uvc" }
lemnos-driver-vcm = { path = "../../drivers/vcm" }
lemnos-driver-vglite = { path = "../../drivers/vglite" }
lemnos-driver-vip9000 = { path = "../../drivers/vip9000" }
lemnos-driver-ws2812 = { path = "../../drivers/ws2812" }
# generated: end drivers

[dev-dependencies]
lemnos-contract-light = { path = "../../contracts/light" }
lemnos-contract-raw-bus = { path = "../../contracts/raw-bus" }
lemnos-contract-pixels = { path = "../../contracts/pixels" }
lemnos-contract-usb-function = { path = "../../contracts/usb-function" }
lemnos-contract-fan = { path = "../../contracts/fan" }
lemnos-contract-fan-control = { path = "../../contracts/fan-control" }
lemnos-contract-temperature = { path = "../../contracts/temperature" }
lemnos-linux-stream = { path = "../../backends/linux-stream" }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
# The shm crates alone: the stream test reads a stream with nothing above them.
shm-ring = { path = "../../shm/ring" }
shm-ring-buffers = { path = "../../shm/ring-buffers" }
shm-ring-holds = { path = "../../shm/ring-holds" }
shm-ring-doorbell = { path = "../../shm/ring-doorbell" }
# Signs a package for the test that starts the daemon in signed mode.
ed25519-dalek = { version = "2.2", default-features = false }
