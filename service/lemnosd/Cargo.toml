[package]
name = "lemnosd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lemnos service: one process owns the hardware and serves every client"

[lints]
workspace = true

[features]
default = []
# Serves the fake devices from `testing/crates/fake-devices`.
fake-devices = ["dep:lemnos-fake-devices"]

[dependencies]
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-host = { path = "../../engine/host" }
lemnos-wire = { path = "../../engine/wire" }
lemnos-package = { path = "../../engine/package" }
lemnos-sim = { path = "../../backends/sim" }
lemnos-linux = { path = "../../backends/linux" }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices", optional = true }
# generated: begin drivers
lemnos-driver-bmi088 = { path = "../../drivers/bmi088" }
lemnos-driver-bmm150 = { path = "../../drivers/bmm150" }
lemnos-driver-coral-loader = { path = "../../drivers/coral-loader" }
lemnos-driver-fan-control = { path = "../../drivers/fan-control" }
lemnos-driver-g2d = { path = "../../drivers/g2d" }
lemnos-driver-generic-sensor = { path = "../../drivers/generic-sensor" }
lemnos-driver-gpio-power-switch = { path = "../../drivers/gpio-power-switch" }
lemnos-driver-gpu-lease = { path = "../../drivers/gpu-lease" }
lemnos-driver-host-clock = { path = "../../drivers/host-clock" }
lemnos-driver-hw-watchdog = { path = "../../drivers/hw-watchdog" }
lemnos-driver-hwmon-fan = { path = "../../drivers/hwmon-fan" }
lemnos-driver-ina2xx = { path = "../../drivers/ina2xx" }
lemnos-driver-isp600 = { path = "../../drivers/isp600" }
lemnos-driver-k230-capture = { path = "../../drivers/k230-capture" }
lemnos-driver-k230isp = { path = "../../drivers/k230isp" }
lemnos-driver-orientation = { path = "../../drivers/orientation" }
lemnos-driver-ov9782 = { path = "../../drivers/ov9782" }
lemnos-driver-pisp = { path = "../../drivers/pisp" }
lemnos-driver-raw-bus = { path = "../../drivers/raw-bus" }
lemnos-driver-rga = { path = "../../drivers/rga" }
lemnos-driver-rkcif = { path = "../../drivers/rkcif" }
lemnos-driver-rkisp = { path = "../../drivers/rkisp" }
lemnos-driver-rkvpss = { path = "../../drivers/rkvpss" }
lemnos-driver-rp1-csi2 = { path = "../../drivers/rp1-csi2" }
lemnos-driver-status-light = { path = "../../drivers/status-light" }
lemnos-driver-sunxi-vin = { path = "../../drivers/sunxi-vin" }
lemnos-driver-thermal-zone = { path = "../../drivers/thermal-zone" }
lemnos-driver-usb-gadget = { path = "../../drivers/usb-gadget" }
lemnos-driver-uvc = { path = "../../drivers/uvc" }
lemnos-driver-vcm = { path = "../../drivers/vcm" }
lemnos-driver-ws2812 = { path = "../../drivers/ws2812" }
# generated: end drivers

[dev-dependencies]
lemnos-client = { path = "../../engine/client" }
lemnos-linux-stream = { path = "../../backends/linux-stream" }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
