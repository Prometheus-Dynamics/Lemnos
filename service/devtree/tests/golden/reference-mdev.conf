# Device nodes the Lemnos daemon opens, given to its group. Generated by `lemnos-ctl tree
# --mdev` from the board file: do not edit. Append to /etc/mdev.conf after the image's
# init/mdev.conf.fragment and before any catch-all line (mdev takes the first line that matches).
# Each line is a BusyBox mdev.conf line: the device name as a regex matched in full, owner:group,
# octal mode. mdev matches the name only, not the subsystem (udev's SUBSYSTEM==): the names are
# the kernel's own, and the daemon checks each node it opens and names one that is not readable
# and writable by its group.

# The kernel module's nodes: /dev/lemnos, and /dev/lemnos-<receiver> for each receiver the module owns (misc devices named by the module).
^lemnos$ root:lemnos 0660
^lemnos-.*$ root:lemnos 0660

# The dma-heaps the board's drivers allocate from: the board file's [host] dma_heaps (default linux,cma), and every dma-buf stream's heap. Each is /dev/dma_heap/<name>.
^dma_heap/linux,cma$ root:lemnos 0660
