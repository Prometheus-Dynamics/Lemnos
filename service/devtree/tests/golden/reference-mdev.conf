# Device nodes the Lemnos daemon opens, given to its group. Generated by `lemnos-ctl tree
# --mdev` from the board file: do not edit. Append to /etc/mdev.conf after the image's
# init/mdev.conf.fragment and before any catch-all line (mdev takes the first line that matches).
# Each line is a BusyBox mdev.conf line: SUBSYSTEM=^subsystem$; (the udev SUBSYSTEM== condition,
# an env match) and the device regex, matched in full against the device's DEVNAME (a dma-heap
# is dma_heap/<name>), then owner:group and an octal mode. Run against BusyBox 1.37.0 and 1.38.0
# (testing/mdev/check.sh). The daemon checks each node it opens after its drop and names one that
# is not readable and writable by its group.

# The kernel module's nodes: /dev/lemnos, and /dev/lemnos-<receiver> for each receiver the module owns (misc devices named by the module).
SUBSYSTEM=^misc$;^lemnos$ root:lemnos 0660
SUBSYSTEM=^misc$;^lemnos-.*$ root:lemnos 0660

# The firmware mailbox the boot count is cleared through (/dev/vcio, a misc device): the slot driver's tryboot record.
SUBSYSTEM=^misc$;^vcio$ root:lemnos 0660

# The dma-heaps the board's drivers allocate from: the board file's [host] dma_heaps (default linux,cma), and every dma-buf stream's heap. Each is /dev/dma_heap/<name>.
SUBSYSTEM=^dma_heap$;^dma_heap/linux,cma$ root:lemnos 0660
