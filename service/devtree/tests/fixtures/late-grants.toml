# The late-grant fixture (HOTPLUG-GRANT): a hwmon fan named by its `name`, a fan named by its directory, a
# host-owned fan (no grant), a PWM channel by its chip's name (granted), and a channel by its device-tree node
# (no grant: its chip's kernel name is probe order). Its generated rules are the golden files beside this one.
format = "lemnos.board"
schema_version = 1

[board]
id = "late-grants"
soc = "bcm2712-rp1"

# The PWM block the channels are on (the reference board's controller, pwm1, on pin 45).
[[hardware]]
controller = "pwm1"
pins = "gpio45"

[[devices]]
id = "fan"
driver = "hwmon-fan"
config = { name = "pwmfan" }

[[devices]]
id = "dir-fan"
driver = "hwmon-fan"
config = { hwmon = "hwmon7" }

[[devices]]
id = "host-fan"
driver = "hwmon-fan"
owner = "host"
config = { name = "hostfan" }

[[devices]]
id = "channel-fan"
driver = "pwm-channel-fan"
uses = { pwm = "pwm:/axi/pcie@1000120000/rp1/pwm@9c000:1" }
config = { frequency_hz = 25000, min_duty = 200, kick_ms = 500 }

[[devices]]
id = "node-fan"
driver = "pwm-channel-fan"
uses = { pwm = "pwm:/axi/pcie@1000120000/rp1/pwm@9c000:3" }
config = { frequency_hz = 24057, min_duty = 200, kick_ms = 500 }
