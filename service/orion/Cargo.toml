[package]
name = "lemnos-orion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Publish every Lemnos device to Orion: a lemnosd client and an Orion provider, with no code for any kind of device"

[lints]
workspace = true

[[bin]]
name = "lemnos-orion"
path = "src/main.rs"

[dependencies]
lemnos-client = { path = "../../engine/client" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-wire = { path = "../../engine/wire" }
# Orion is not published: its one client crate, pinned to a revision of its `next` branch.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df", default-features = false, features = ["provider", "files"] }
# Sends a `LinkOffer` with a gadget's endpoints to the comm core over the board's socket.
orion-connect = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-msg-session = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
# The cancel reason (`CancelReason`) of a run, which the facade does not re-export.
orion-msg-actions = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-wire = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
lemnos-linux-stream = { path = "../../backends/linux-stream" }
lemnos-slot-store = { path = "../../drivers/slot-store" }
# Already in the tree through Orion's client: waits on the Orion session and the wake-up together.
# The SHA-256 a file sent to a device is checked against; already in the tree.
sha2 = { version = "0.10", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[dev-dependencies]
# The test relay forwards the file descriptors Orion's transport passes with its frames.
rustix = { version = "1", default-features = false, features = ["std", "net"] }
# A real comm core and real node logic, in-process, for the integration tests.
orion-node-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df", default-features = false }
orion-config = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-stubs = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
lemnosd = { path = "../lemnosd" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-driver-board-self-test = { path = "../../drivers/board-self-test" }
lemnos-contract-self-test = { path = "../../contracts/self-test" }
lemnos-driver-system-slots = { path = "../../drivers/system-slots" }
lemnos-driver-system-flash = { path = "../../drivers/system-flash" }
lemnos-driver-system-identity = { path = "../../drivers/system-identity" }
lemnos-driver-usb-gadget = { path = "../../drivers/usb-gadget" }
lemnos-driver-raw-bus = { path = "../../drivers/raw-bus" }
lemnos-driver-ws2812 = { path = "../../drivers/ws2812" }
lemnos-driver-indicator = { path = "../../drivers/indicator" }
lemnos-contract-indicator = { path = "../../contracts/indicator" }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
orion-server = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-link-usb = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-link-serial = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-unix = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-hello = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
orion-keys = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "dbd5fc08b9e55a117f10105ae103d2ad04cd14df" }
lemnos-host = { path = "../../engine/host" }
lemnos-sim-walk = { path = "../../testing/crates/sim-walk" }
lemnos-sim = { path = "../../backends/sim" }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
