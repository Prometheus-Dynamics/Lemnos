[package]
name = "lemnos-orion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Publish every Lemnos device to Orion: a lemnosd client and an Orion provider, with no code for any kind of device"

[lints]
workspace = true

[[bin]]
name = "lemnos-orion"
path = "src/main.rs"

[dependencies]
lemnos-client = { path = "../../engine/client" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-wire = { path = "../../engine/wire" }
# Orion is not published: its one client crate, pinned to a revision of its `next` branch.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "61e95a426a74fcd129be15a41015c446ea304133", default-features = false, features = ["provider"] }
# Already in the tree through Orion's client: waits on the Orion session and the wake-up together.
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[dev-dependencies]
# A real comm core and real node logic, in-process, for the integration tests.
orion-node-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "61e95a426a74fcd129be15a41015c446ea304133", default-features = false }
orion-config = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "61e95a426a74fcd129be15a41015c446ea304133" }
orion-stubs = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "61e95a426a74fcd129be15a41015c446ea304133" }
lemnosd = { path = "../lemnosd" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
