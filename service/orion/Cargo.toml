[package]
name = "lemnos-orion"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Publish every Lemnos device to Orion: a lemnosd client and an Orion provider, with no code for any kind of device"

[lints]
workspace = true

[[bin]]
name = "lemnos-orion"
path = "src/main.rs"

[dependencies]
lemnos-client = { path = "../../engine/client" }
lemnos-core = { path = "../../engine/core", features = ["std"] }
lemnos-linux-sys = { path = "../../backends/linux-sys" }
lemnos-wire = { path = "../../engine/wire" }
# Orion is not published: its one client crate, pinned to a revision of its `next` branch.
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8", default-features = false, features = ["provider", "files"] }
# Sends a `LinkOffer` with a gadget's endpoints to the comm core over the board's socket.
orion-connect = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-msg-session = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-wire = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
lemnos-linux-stream = { path = "../../backends/linux-stream" }
lemnos-slot-store = { path = "../../drivers/slot-store" }
# Already in the tree through Orion's client: waits on the Orion session and the wake-up together.
# The SHA-256 a file sent to a device is checked against; already in the tree.
sha2 = { version = "0.10", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[dev-dependencies]
# A real comm core and real node logic, in-process, for the integration tests.
orion-node-app = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8", default-features = false }
orion-config = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-stubs = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
lemnosd = { path = "../lemnosd" }
lemnos-fake-devices = { path = "../../testing/crates/fake-devices" }
lemnos-driver-system-slots = { path = "../../drivers/system-slots" }
lemnos-driver-system-flash = { path = "../../drivers/system-flash" }
lemnos-driver-system-identity = { path = "../../drivers/system-identity" }
lemnos-driver-usb-gadget = { path = "../../drivers/usb-gadget" }
lemnos-hal = { path = "../../engine/hal", features = ["std"] }
orion-server = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-link-usb = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-link-serial = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-unix = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-hello = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
orion-keys = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "455a956e13e62c97081d66e0e8f3bf2aced1eac8" }
lemnos-host = { path = "../../engine/host" }
lemnos-sim = { path = "../../backends/sim" }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
