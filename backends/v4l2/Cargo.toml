[package]
name = "lemnos-v4l2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe Rust interfaces to Linux V4L2 video nodes, subdevices, the media controller and V4L2 events, in pure Rust"

[lints]
workspace = true

# Linux only: every system call goes through lemnos-linux-sys, the one crate allowed `unsafe`.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
lemnos-linux-sys = { path = "../linux-sys" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemnos-measure = { path = "../../engine/measure", features = ["alloc-count"] }
