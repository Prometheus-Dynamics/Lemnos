[package]
name = "lemnos-linux-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux uAPI structures and safe wrappers over the system calls Lemnos needs: i2c-dev, spidev, GPIO, netlink, inotify, poll, signalfd, dma-heap, dma-buf, mappings, V4L2 and the media controller."

# One of the crates allowed `unsafe`, so it keeps its own lint table: every block carries a
# `SAFETY` comment and holds one operation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
default = []
# `test_alloc`: an allocation-counting global allocator for another crate's tests.
alloc-count = []
# A pseudo-terminal pair, for tests of serial code in other crates.
test-pty = []
# A recording stand-in for usbdevfs, for tests of USB code in other crates.
test-usbfs = []
# The fake camera receiver of the QEMU harness (`testing/qemu/test_block`): firing its status word.
test-csi2 = []

[dependencies]
libc.workspace = true
