[package]
name = "lemnos-linux-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux support for taking a Lemnos frame stream: receiving descriptors and mapping them"

[lints]
workspace = true

# With no features: the mappings alone, over lemnos-linux-sys and lemnos-wire's ring, with no
# part of the engine.
[features]
default = ["client"]
# The `StreamPlatform` lemnos-client takes.
client = ["dep:lemnos-client"]

[dependencies]
lemnos-client = { path = "../../engine/client", optional = true }
lemnos-wire = { path = "../../engine/wire", default-features = false }
lemnos-linux-sys = { path = "../linux-sys" }
