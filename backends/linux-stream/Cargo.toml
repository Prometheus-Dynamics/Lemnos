[package]
name = "lemnos-linux-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Linux support for taking a Lemnos frame stream: receiving descriptors and bracketing dma-buf access"

[lints]
workspace = true

# With no features: the descriptor receive and the dma-buf brackets alone, over lemnos-linux-sys,
# with no part of the engine.
[features]
default = ["client"]
# The `StreamPlatform` lemnos-client takes.
client = ["dep:lemnos-client"]

[dependencies]
lemnos-client = { path = "../../engine/client", optional = true }
lemnos-linux-sys = { path = "../linux-sys" }
