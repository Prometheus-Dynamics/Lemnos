# OPTIONAL. Install as /usr/lib/modules-load.d/lemnos.conf only on an image that ships lemnos.ko.
# Loads the kernel module at boot. The module claims nothing by itself: the image's modprobe.d
# gives `owned=` (see docs/kernel-module.md), and without a claim it does nothing harmful.
# Delete this file when the image has no lemnos.ko; systemd logs an error if the module is missing.
lemnos
