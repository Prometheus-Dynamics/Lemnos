# systemd-sysusers(8): the lemnos user and group. Install as /usr/lib/sysusers.d/lemnos.conf.
# The daemon runs as this user after its root phase (`--user lemnos`). Its uid is the system's choice (`-`): nothing
# keys on it, since the socket and the device nodes are shared by group. Programs that talk to
# lemnosd are added to the lemnos group by the OS, as usual.
u lemnos - "Lemnos daemon" - -
# The Orion bridge's user. It drops to this user itself, with the groups in /etc/lemnos/lemnos-orion.env.
u lemnos-orion - "Lemnos bridge to Orion" - -
