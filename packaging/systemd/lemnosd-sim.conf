# Simulated board (lemnosd --sim): a drop-in for lemnosd.service on an image whose
# lemnosd is built with the `sim` feature. Install it as
# /etc/systemd/system/lemnosd.service.d/sim.conf (the sim layer, gaia/lemnosd-sim.toml,
# stages it). The board definition stays the device package's /etc/lemnos/board.toml;
# the script is /etc/lemnos/sim.toml. See packaging/README.md, Simulated board.
[Service]
# The list is reset, then set: the unit's own ExecStart is replaced.
ExecStart=
ExecStart=/usr/bin/lemnosd --sim --sim-script /etc/lemnos/sim.toml
# The sim's files (sysfs tree, LED frame file, saved state): writable by the
# service user, which is `lemnos`. systemd removes a RuntimeDirectory when the
# service stops, so the sim's saved state starts fresh at each start.
RuntimeDirectory=lemnos-sim
Environment=LEMNOSD_SIM_ROOT=/run/lemnos-sim
