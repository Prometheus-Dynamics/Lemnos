  {path = "/proc/mounts", kind = "file", access = "ro", how = "none", drivers = ["drivers/slot-store"], reason = "the mount table, read (the grow)"},
  {path = "/proc/self/mountinfo", kind = "file", access = "ro", how = "none", drivers = ["drivers/system-flash", "drivers/system-slots"], reason = "the daemon's own mount table, read"},
  {path = "/proc/sys/kernel/random/boot_id", kind = "file", access = "ro", how = "none", drivers = ["drivers/system-slots"], reason = "the boot id, read; /proc/sys is read-only under ProtectKernelTunables"},
  {path = "/proc/self/fd", kind = "path", access = "ro", how = "none", drivers = ["backends/linux-sys", "drivers/codec-jobs", "engine/abi", "shm/ring"], reason = "a descriptor's path, read (the daemon's own fds)"},
  {path = "/proc/*/ns/mnt", kind = "path", access = "ro", how = "none", drivers = ["backends/linux-sys"], reason = "a sandboxed child's mount namespace, read"},
  {path = "/proc/*/*", kind = "path", access = "ro", how = "none", drivers = ["backends/linux-sys"], reason = "a sandboxed child's status and namespace files (seccomp.rs names them), read"},
  {path = "/data", kind = "root", access = "ro", how = "none", drivers = ["drivers/named-files", "drivers/system-identity", "drivers/system-slots"], reason = "the data partition's root, read; the writes are the two granted dirs"},
  {path = "/boot/firmware", kind = "path", access = "ro", how = "none", drivers = ["drivers/named-files", "drivers/system-slots"], reason = "the boot partition, read (the firmware's files and the board's records)"},
  {path = "/etc/machine-id", kind = "file", access = "ro", how = "none", drivers = ["drivers/system-identity"], reason = "the machine id, read; slot-init binds it read-only"},
  {path = "/etc/group", kind = "file", access = "ro", how = "none", drivers = ["drivers/system-slots"], reason = "the daemon's group id, read to give the slot dirs"},
  {path = "/etc/board", kind = "path", access = "ro", how = "none", drivers = ["drivers/slot-store"], reason = "the security view's reader path (the image links it to /run/board); read only"},
