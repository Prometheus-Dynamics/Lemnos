# What the packaged lemnosd unit grants, and what each grant is for. Checked by scripts/check-unit-grants.py
# (the gate runs it). Read it with packaging/systemd/lemnosd.service and its drop-ins beside it.
#
# One row per grant or per thing a driver reaches. Fields:
#   path     what is reached: a device node (`/dev/...`, a glob with `*`), a directory or file, a capability
#            (`CAP_...`), a syscall group or call (`@setuid`, `mount`), or an address family (`AF_UNIX`).
#   kind     device | root (one directory, exact) | path (a directory: everything under it) | file | cap |
#            syscall | family.
#   access   ro | rw. A rw row must be writable under the unit: under /dev or /run (the writable API and
#            runtime trees), or a ReadWritePaths grant over it.
#   how      udev  a group grant in packaging/udev/70-lemnos.rules (`token` is the rule line, `subsystem`
#                  its SUBSYSTEM, `node` a node the rule matches);
#            unit  a directive of packaging/systemd/lemnosd.service (`token` is `Directive:value`);
#            drop-in  the same, in a drop-in of packaging/systemd/lemnosd.service.d/ (`when` is its
#                  `when` in packaging/files.txt: the boards that install it);
#            none  the base unit allows it already (a read, or a write under /dev or /run);
#            image the grant is the image's, not this package's (a vendor node the image adds, see
#                  packaging/udev/70-lemnos.rules; `reason` says which), so the gate lists it and does not check it;
#            generated  the board's own fragment (`lemnos-ctl tree BOARD --udev`), listed for the same reason.
#   drivers  the crates (directories) that reach it. The gate fails if a crate lemnosd links reaches a path no
#            row covers for that crate, or if a row no crate reaches (a grant nothing needs).
#   needle   for a grant with no literal path in the source (a capability, a syscall, a family, a
#            configured node): a text that must appear in one of its drivers' production source.
#   reason   why. Required for `image` and `generated`, and for every `none` row.
#
# Scope: the lemnosd process and the crates it links (the path closure of service/lemnosd, tests and
# examples left out, `#[cfg(test)]` blocks left out). The root phase's helpers (gadget helper, supervisor)
# are lemnosd's own children and sit in the same closure. slot-init, good-boot, orion and their units are
# not in this table: each has its own unit. A path a board names in its config, not as a literal in the
# source (a system-flash `path`, a serial `path`), is covered by the row of its driver's node family.
#
# Limits: `access` is the author's declaration, not inferred from the code. Syscall and family rows are
# checked for their needle, not for every call a driver makes; the QEMU stanza `unit` runs the real unit
# and its filter.

grant = [
  # --- the unit: the runtime directory, capabilities, syscalls, families
  {path = "/run/lemnos", kind = "path", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "RuntimeDirectory:lemnos", drivers = ["drivers/system-slots", "service/lemnosd"], reason = "the socket directory; systemd makes it, the root phase hands it to lemnos; kept across restarts (RuntimeDirectoryPreserve=restart) for the slot driver's boot-good mark (/run/lemnos/boot-good)"},
  {path = "CAP_CHOWN", kind = "cap", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "CapabilityBoundingSet:CAP_CHOWN", drivers = ["backends/linux-sys", "service/lemnosd"], needle = "CAP_CHOWN", reason = "the root phase changes the owner of the runtime directory before the drop"},
  {path = "CAP_SETGID", kind = "cap", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "CapabilityBoundingSet:CAP_SETGID", drivers = ["backends/linux-sys", "service/lemnosd"], needle = "CAP_SETGID", reason = "the root phase's group change, and the gadget supervisor's"},
  {path = "CAP_SETUID", kind = "cap", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "CapabilityBoundingSet:CAP_SETUID", drivers = ["backends/linux-sys", "service/lemnosd"], needle = "CAP_SETUID", reason = "the root phase's change of user (`--user lemnos`)"},
  {path = "CAP_SETPCAP", kind = "cap", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "CapabilityBoundingSet:CAP_SETPCAP", drivers = ["backends/linux-sys", "service/lemnosd"], needle = "CAP_SETPCAP", reason = "the drop: the bounding set, and the gadget helper's CAP_SETPCAP clear"},
  {path = "CAP_SYS_RAWIO", kind = "cap", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "CapabilityBoundingSet:CAP_SYS_RAWIO", drivers = ["backends/linux-sys", "backends/linux", "service/lemnosd"], needle = "CAP_SYS_RAWIO", reason = "the one the daemon keeps: the module's register mapping through /dev/lemnos"},
  {path = "AF_UNIX", kind = "family", access = "rw", how = "unit", via = "packaging/systemd/lemnosd.service", token = "RestrictAddressFamilies:AF_UNIX", drivers = ["backends/linux-sys", "service/lemnosd"], needle = "AF_UNIX", reason = "the client socket under /run/lemnos"},
