  # --- paths the source builds from sysfs or from the board's config, and the grants the root phase makes
  # (`how = "root-phase"`: the root phase hands them over before the drop, through the named call, `wired`,
  # in service/lemnosd/src/privilege.rs; `site` and `needle` are the code that makes it). A `dynamic` row has
  # no package grant: it is tagged `open` with the work that owns it, and the gate prints it.
  # The PWM channel's attributes: the chown lands on the device behind /sys/class/pwm, under
  # /sys/devices/platform. /sys is writable under the base unit (ProtectKernelTunables=yes leaves it rw on
  # systemd 259.10, PWM-SYSFS-UNIT's guest run), so no unit or drop-in line grants it.
  {path = "/sys/devices/platform", kind = "path", access = "rw", how = "root-phase", site = "backends/linux/src/pwm.rs", needle = "pub(crate) fn grant", wired = "grant_pwm_before_drop", drivers = ["backends/linux"], hotplug_udev = ["SUBSYSTEM==\"pwm\", ACTION==\"change\", ENV{EXPORT}==\"pwm1\", PROGRAM==\"/bin/sh -c 'readlink -f $sys$devpath/device/of_node | grep -qx /sys/firmware/devicetree/base/axi/pcie@1000120000/rp1/pwm@9c000'\", RUN+=\"/bin/chgrp lemnos $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\", RUN+=\"/bin/chmod 0660 $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\"", "SUBSYSTEM==\"pwm\", ACTION==\"change\", ENV{EXPORT}==\"pwm3\", PROGRAM==\"/bin/sh -c 'readlink -f $sys$devpath/device/of_node | grep -qx /sys/firmware/devicetree/base/axi/pcie@1000120000/rp1/pwm@9c000'\", RUN+=\"/bin/chgrp lemnos $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\", RUN+=\"/bin/chmod 0660 $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\"", "SUBSYSTEM==\"pwm\", ACTION==\"change\", KERNEL==\"pwmchip0\", ENV{EXPORT}==\"pwm1\", RUN+=\"/bin/chgrp lemnos $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\", RUN+=\"/bin/chmod 0660 $sys$devpath/$env{EXPORT}/period $sys$devpath/$env{EXPORT}/duty_cycle $sys$devpath/$env{EXPORT}/polarity $sys$devpath/$env{EXPORT}/enable\""], hotplug_mdev = ["-SUBSYSTEM=^pwm$;EXPORT=^pwm1$;^pwmchip[0-9]+$ root:root 0660 */bin/sh -c 'test \"$(readlink -f /sys$DEVPATH/device/of_node)\" = /sys/firmware/devicetree/base/axi/pcie@1000120000/rp1/pwm@9c000 && for a in period duty_cycle polarity enable; do /bin/chgrp lemnos /sys$DEVPATH/$EXPORT/$a && /bin/chmod 0660 /sys$DEVPATH/$EXPORT/$a; done'", "-SUBSYSTEM=^pwm$;EXPORT=^pwm3$;^pwmchip[0-9]+$ root:root 0660 */bin/sh -c 'test \"$(readlink -f /sys$DEVPATH/device/of_node)\" = /sys/firmware/devicetree/base/axi/pcie@1000120000/rp1/pwm@9c000 && for a in period duty_cycle polarity enable; do /bin/chgrp lemnos /sys$DEVPATH/$EXPORT/$a && /bin/chmod 0660 /sys$DEVPATH/$EXPORT/$a; done'", "-SUBSYSTEM=^pwm$;EXPORT=^pwm1$;^pwmchip0$ root:root 0660 */bin/sh -c 'for a in period duty_cycle polarity enable; do /bin/chgrp lemnos /sys$DEVPATH/$EXPORT/$a && /bin/chmod 0660 /sys$DEVPATH/$EXPORT/$a; done'"], reason = "PWM channel attributes (period, duty_cycle, polarity, enable) are chowned by the root phase to root:lemnos 0660 before the drop (PWM-SYSFS-UNIT); a channel that is not there at start is not refused (HOTPLUG-GRANT): the board's generated lines grant the attributes of its channel when root exports it (the chip's change event, EXPORT=pwmN, tested on a real kernel chip); the daemon never exports"},
  # The kernel module's nodes: the root phase sets each one's driver_override, has the stock driver the SoC map
  # names let it go, and binds the module's driver (`claim_module_nodes`, backends/linux/src/claim.rs). Root
  # writes, once, before the drop; /sys stays writable under the base unit (see gadget.conf). Nothing later.
  {path = "/sys/bus/platform", kind = "path", access = "rw", how = "root-phase", site = "service/lemnosd/src/privilege.rs", needle = "pub fn claim_module_nodes", wired = "claim_module_nodes", drivers = ["service/lemnosd"], reason = "driver_override, the stock driver's unbind and the module driver's bind of each node the board gives to the kernel module, written as root by the root phase before the drop; a board without module nodes writes nothing"},
  # The fan's attributes (pwm1, pwm1_enable): the same grant, by the root phase's hwmon step. Untested on board
  # (testing/board-runs/UNIT-GRANTS.md).
  {path = "/sys/class/hwmon", kind = "path", access = "rw", how = "root-phase", site = "drivers/hwmon-fan/src/grant.rs", needle = "pub fn grant_before_drop", wired = "lemnos_driver_hwmon_fan::grant_before_drop", drivers = ["drivers/hwmon-fan"], hotplug_udev = ["SUBSYSTEM==\"hwmon\", ACTION==\"add\", ATTR{name}==\"pwmfan\", TEST==\"pwm1\", RUN+=\"/bin/chgrp lemnos $sys$devpath/pwm1\", RUN+=\"/bin/chmod 0660 $sys$devpath/pwm1\"", "SUBSYSTEM==\"hwmon\", ACTION==\"add\", ATTR{name}==\"pwmfan\", TEST==\"pwm1_enable\", RUN+=\"/bin/chgrp lemnos $sys$devpath/pwm1_enable\", RUN+=\"/bin/chmod 0660 $sys$devpath/pwm1_enable\"", "SUBSYSTEM==\"hwmon\", ACTION==\"add\", KERNEL==\"hwmon7\", TEST==\"pwm1\", RUN+=\"/bin/chgrp lemnos $sys$devpath/pwm1\", RUN+=\"/bin/chmod 0660 $sys$devpath/pwm1\"", "SUBSYSTEM==\"hwmon\", ACTION==\"add\", KERNEL==\"hwmon7\", TEST==\"pwm1_enable\", RUN+=\"/bin/chgrp lemnos $sys$devpath/pwm1_enable\", RUN+=\"/bin/chmod 0660 $sys$devpath/pwm1_enable\""], hotplug_mdev = ["-SUBSYSTEM=^hwmon$;^hwmon[0-9]+$ root:root 0660 @/bin/sh -c 'test \"$(cat /sys$DEVPATH/name)\" = pwmfan || exit 0; for a in pwm1 pwm1_enable; do /bin/chgrp lemnos /sys$DEVPATH/$a && /bin/chmod 0660 /sys$DEVPATH/$a; done'", "-SUBSYSTEM=^hwmon$;^hwmon7$ root:root 0660 @/bin/sh -c 'for a in pwm1 pwm1_enable; do /bin/chgrp lemnos /sys$DEVPATH/$a && /bin/chmod 0660 /sys$DEVPATH/$a; done'"], reason = "a hwmon fan's pwm1 and pwm1_enable are chowned by the root phase to root:lemnos 0660 before the drop: the duty and mode writes of the fan driver, which is root's otherwise. A fan that is not there at start, or whose attributes the daemon may not write yet, is not refused: its driver binds it under the failure rule (HOTPLUG-GRANT), and the board's generated lines grant pwm1 and pwm1_enable on the add event of the board's own fan (matched by its name or directory, never a host-owned fan)"},
  # The U-Boot environment's copies: the GPT form's own partition (found by its type GUID, its node through sysfs), or
  # the device `uboot_env_device` names. The root phase hands the node over before the drop (`uboot::root_phase`, which
  # system-slots' root phase calls); the daemon's `uboot` record writes through that file and never opens the node by name.
  {path = "config:uboot_env_device", kind = "device", access = "rw", how = "root-phase", site = "drivers/system-slots/src/uboot.rs", needle = "pub fn root_phase", wired = "lemnos_driver_system_slots::root_phase", drivers = ["drivers/system-slots"], reason = "the U-Boot environment's node, named by the board's config: the GPT partition (root:disk, the kernel's node) or uboot_env_device. The root phase hands it over read-write, or read only when the boot partition holds the FAT environment; no package line grants the daemon the group, and slot-init writes the copies in its own unit"},
  # UBI volumes and the control node on raw NAND: the System writer's ioctls and volume opens. Built, not granted.
  {path = "/dev/ubi*", kind = "device", access = "rw", how = "dynamic", open = "UNIT-GRANTS-designs: UBI helper", site = "drivers/slot-store/src/ubi.rs", needle = "pub trait UbiWrite", drivers = ["drivers/slot-store"], reason = "UBI control and volume nodes (the raw NAND slot images and the boot record's volume): the ioctls need the control node and the volume nodes, which no package line grants; the helper is the design's"},
  # The boot partition: root:disk, so the root phase opens it before the drop and hands the file over. The
  # `tryboot` record's root phase (system-slots) makes the hand-over; the daemon never opens it by name.
  # The first-flash target: a whole disk (root:disk 0660 under udev, root:root under devtmpfs alone, as on the RAM
  # flasher). The root phase opens it read-write before the drop and hands the file over (system-flash's root phase);
  # the daemon never opens it by name. A target that is a regular file (a test's) is opened by name.
  {path = "first-flash target (root-phase hand-over)", kind = "device", access = "rw", how = "root-phase", site = "drivers/system-flash/src/target.rs", needle = "pub fn hand_over", wired = "lemnos_driver_system_flash::root_phase", drivers = ["drivers/system-flash"], reason = "the first flash's target disk is root's: the root phase opens it read-write before the drop and hands the descriptor over (system-flash's root phase); not handed over when the running system is mounted from it, or when the disk isn't there at the start (its open then says so by name)"},
  {path = "boot partition node (root-phase hand-over)", kind = "device", access = "rw", how = "root-phase", site = "drivers/slot-store/src/boot_node.rs", needle = "pub fn hand_over", wired = "lemnos_driver_system_slots::root_phase", drivers = ["drivers/slot-store"], reason = "the boot partition is root:disk: the root phase opens it before the drop and hands the descriptor over (system-slots' root phase); the daemon never opens it by name"},
  # The restart helper's socket: the daemon connects to it to ask for a restart, as its own user in group lemnos. The
  # socket is root's, group lemnos, mode 0660 (packaging/systemd/lemnos-restart.socket); a connect is a write under /run,
  # which the base unit allows. The helper answers only root and the daemon's user (service/restart-helper/src/serve.rs).
  {path = "/run/lemnos-flash", kind = "path", access = "ro", how = "none", drivers = ["drivers/system-flash"], reason = "not reached by lemnosd: the Orion bridge's directory for a flash device's pushed manifest (PUSHED_FILES_DIR), kept in the driver so lemnos-ctl tree --bridge-env writes it; the bridge's own unit drop-in grants it"},
  {path = "/run/lemnos-restart.sock", kind = "file", access = "rw", how = "none", drivers = ["service/restart-helper"], reason = "the restart helper's socket: the daemon connects to it as group lemnos; /run is writable under the base unit"},
  # The service manager's private socket: reached by the helper's own unit (lemnos-restart.service, root), never by lemnosd.
  # The daemon links the helper's client, not this path. /run is writable under the base unit.
  {path = "/run/systemd/private", kind = "file", access = "rw", how = "none", drivers = ["service/restart-helper"], reason = "the service manager's private socket, reached by the helper's own root unit (lemnos-restart.service), not by lemnosd; /run is writable under the base unit"},
]
