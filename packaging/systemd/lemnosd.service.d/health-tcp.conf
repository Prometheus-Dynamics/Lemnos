# Drop-in for a board whose board file names a `tcp:` health source (`system-slots`, `health`).
# Install as /etc/systemd/system/lemnosd.service.d/health-tcp.conf on those boards only; the base
# unit allows no Internet socket, so its exposure stays at the baseline. Read by
# scripts/check-packaging.sh.
#
# A `tcp:<address>:<port>` source is one connect at each look of a trial, made by the daemon to a
# port on the board (docs/slots.md, "How a trial resolves"). Systemd adds these two families to the
# base unit's RestrictAddressFamilies (list settings accumulate across drop-ins). Without them the
# socket is refused (`Address family not supported by protocol`), the source is never good, and
# every trial falls back at its deadline. The daemon listens on nothing and sends no byte.
[Service]
RestrictAddressFamilies=AF_INET AF_INET6
