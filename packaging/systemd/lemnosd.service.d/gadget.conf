# Drop-in for a board whose board file has a USB gadget (`usb-gadget` devices). Install as
# /etc/systemd/system/lemnosd.service.d/gadget.conf on those boards only; the base unit has no gadget
# settings, so its exposure stays at the baseline. Read by scripts/check-packaging.sh.
#
# The gadget helper (service/lemnosd/src/helper.rs) and its root parent (supervisor.rs, which forks the helper
# again when it dies) are forked by the root phase and keep root after the drop. The helper keeps this one
# capability: CAP_SYS_ADMIN, for the FunctionFS mount and its unmount; the parent keeps it and the two the
# helper needs to drop the rest (CAP_SETPCAP, CAP_SETGID, in the base unit's set already).
# Systemd adds this line to the base unit's CapabilityBoundingSet (list settings accumulate across
# drop-ins). The daemon itself keeps none of it. Both are children of the daemon, so they run under the
# unit's filter too: `mount umount2` are the two calls this drop-in adds to SystemCallFilter. Each also
# installs its own seccomp allowlist (docs/daemon.md, "Privileged helper").
[Service]
CapabilityBoundingSet=CAP_SYS_ADMIN
SystemCallFilter=mount umount2
# The gadget's configfs tree and its UDC attribute: the helper makes the tree and writes UDC, as root;
# the daemon asks it to (service/lemnosd/src/gadget.rs). ProtectKernelTunables=yes makes /sys read-only,
# and configfs is under /sys, so this path is the one writable piece of it. Missing on a board without
# a gadget: the dash makes that fine.
ReadWritePaths=-/sys/kernel/config/usb_gadget
