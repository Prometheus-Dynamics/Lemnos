# Drop-in for a board whose board file has a [security] table. Install as
# /etc/systemd/system/lemnosd.service.d/security.conf on those boards only. Read by
# scripts/check-packaging.sh and scripts/check-packaging-files.py.
#
# The security switch writes its record (`[security] record`, a file under /var/lib/lemnos; a
# system-security device with `record = "boot"` writes SECURE.REC on the boot partition instead,
# through the node its root phase hands over) and re-renders the view in /run/board. Both are
# made by the generated unit `lemnos-board-security.service` (`lemnos-ctl tree --security-unit`),
# owned by the daemon's user, before lemnosd starts. The daemon chowns neither. A record
# outside /var/lib/lemnos fails the packaging check and `lemnos-ctl tree --security-unit` by name.
[Service]
ReadWritePaths=-/var/lib/lemnos /run/board
