# Drop-in for a board whose board file has a `system-slots` device. Install as
# /etc/systemd/system/lemnosd.service.d/slots.conf on those boards only. Read by
# scripts/check-packaging.sh and scripts/check-packaging-files.py.
#
# ProtectSystem=strict makes the filesystem read-only. The slot driver keeps its state in
# <data>/board/slots and its images in <data>/slots (`data`, default /data), so those two are the
# writable pieces. slot-init (the initramfs, root) gives both to the daemon's user before it starts
# lemnosd, and only when the boot records are this system's. On a board whose records are another
# system's, nothing is given and the driver writes nothing there (docs/slots.md, "Route A").
# A board file with another `data` must change these paths to match. The packaging check fails by
# name when they don't.
#
# Both paths are optional (`-`). On a disk whose boot records are another system's, or a layout
# another version made, slot-init makes neither dir (it writes nothing under board/slots there). A
# required path that is missing fails the unit's namespace setup (226/NAMESPACE), and the daemon
# would restart in a loop the hardware watchdog reboots. Left out, lemnosd starts, and the slots
# driver says why in its health (`foreign`) and writes nothing (docs/slots.md, "Route A").
[Service]
ReadWritePaths=-/data/board/slots -/data/slots
